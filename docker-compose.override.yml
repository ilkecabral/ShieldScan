# ============================================================
# ShieldScan — Local Dev Override
# Automatically applied by: docker compose up -d
# Overrides docker-compose.yml for local Mac development:
#   - Nginx: HTTP-only (no SSL required)
#   - Nginx: server_name = localhost
#   - API: Ollama URL points to Mac host, not container
# ============================================================

version: "3.9"

services:

  api:
    environment:
      # Fix: inside Docker, localhost = the container, not your Mac.
      # host.docker.internal resolves to the Mac host from inside a container.
      OLLAMA_BASE_URL: http://host.docker.internal:11434

  nginx:
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/frontend:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      # 443 removed — no SSL in local dev
