# ============================================================
# ShieldScan — Nginx LOCAL DEV config (HTTP only, no SSL)
# Used by docker-compose.override.yml automatically.
# For production with a real domain, use nginx.conf instead.
# ============================================================

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # ── Frontend (static files) ─────────────────────────────
    root /usr/share/nginx/html;
    index landing.html;

    location / {
        try_files $uri $uri/ /landing.html;
        # Don't cache in dev
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires off;
    }

    # ── API proxy ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # ── Health check ────────────────────────────────────────
    location /health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        access_log off;
    }

    # ── Admin panel ─────────────────────────────────────────
    location /admin {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
    }

    # ── CNAPPgoat Lab ────────────────────────────────────────
    location /cnappgoat/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Allow iframe embedding — override FastAPI's X-Frame-Options: DENY
        proxy_hide_header  X-Frame-Options;
        add_header         X-Frame-Options "SAMEORIGIN" always;
    }

    # ── Block dotfiles ───────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }
}
