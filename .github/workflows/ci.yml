# ============================================================
# ShieldScan CI/CD Pipeline
#
# Triggers: push to main or any branch, PRs to main
#
# Jobs:
#   1. security-scan  — Trivy FS scan + pip-audit (no secrets required)
#   2. test           — pytest against real PostgreSQL (no secrets required)
#   3. docker         — build image + push (optional: Docker Hub OR ECR)
#
# Required secrets — NONE (CI works zero-config out of the box)
#
# Optional secrets for image push (set in GitHub repo Settings → Secrets):
#   DOCKER_USERNAME       — Docker Hub username
#   DOCKER_TOKEN          — Docker Hub access token
#   AWS_ECR_ROLE_ARN      — IAM role ARN for OIDC push to ECR (future AWS deploy)
#   AWS_REGION            — e.g. eu-west-3
# ============================================================

name: CI

on:
  push:
    branches:
      - main
      - "kiran/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:

  # ── Job 1: Security scan ─────────────────────────────────────
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan codebase (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table
        continue-on-error: true   # warn but don't block on unpatched vulns in deps

      - name: Scan Python deps (pip-audit)
        run: |
          pip install pip-audit --quiet
          pip-audit -r app/backend/requirements.txt || true

  # ── Job 2: Tests ─────────────────────────────────────────────
  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: security-scan

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: shieldscan_test
          POSTGRES_USER: shieldscan
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U shieldscan"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r app/backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      # ── Generate test credentials if secrets are not set ──
      # conftest.py also sets these via os.environ.setdefault(),
      # but we set them here so they're visible in the CI log.
      - name: Generate test credentials
        id: creds
        run: |
          JWT=$(python -c "import secrets; print(secrets.token_hex(32))")
          FERNET=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          echo "jwt=$JWT" >> $GITHUB_OUTPUT
          echo "fernet=$FERNET" >> $GITHUB_OUTPUT

      - name: Run pytest
        env:
          # Use real PostgreSQL for tests (same as production)
          DATABASE_URL: postgresql://shieldscan:testpass@localhost:5432/shieldscan_test
          # Use provided secrets if set, otherwise use generated values above
          JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY || steps.creds.outputs.jwt }}
          AWS_ENCRYPTION_KEY: ${{ secrets.CI_AWS_ENCRYPTION_KEY || steps.creds.outputs.fernet }}
          AI_PROVIDER: ollama    # No real LLM calls in CI
          ENV: test
          ADMIN_PASSWORD: ""     # Skip admin seeding in CI
        run: |
          cd app
          python -m pytest backend/tests/ -v --tb=short

  # ── Job 3: Docker build ──────────────────────────────────────
  # Always builds on push to main (validates Dockerfile + build context).
  # Pushes to Docker Hub if DOCKER_USERNAME + DOCKER_TOKEN secrets are set.
  # Pushes to ECR if AWS_ECR_ROLE_ARN + AWS_REGION secrets are set.
  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write   # needed for OIDC → ECR (only used if AWS secrets are set)
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Build from ./app context (includes alembic/ + backend/)
      - name: Build Docker image
        run: |
          docker build \
            -f app/backend/Dockerfile \
            -t shieldscan-api:${{ github.sha }} \
            -t shieldscan-api:latest \
            ./app

      # ── Push to Docker Hub (if credentials are configured) ──
      - name: Push to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag shieldscan-api:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/shieldscan-api:${{ github.sha }}
          docker tag shieldscan-api:latest \
            ${{ secrets.DOCKER_USERNAME }}/shieldscan-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/shieldscan-api:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/shieldscan-api:latest
          echo "Pushed to Docker Hub: ${{ secrets.DOCKER_USERNAME }}/shieldscan-api:${{ github.sha }}"

      # ── Push to AWS ECR (if AWS secrets are configured) ─────
      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ECR_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Push to Amazon ECR
        if: ${{ secrets.AWS_ECR_ROLE_ARN != '' }}
        run: |
          AWS_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          ECR="${AWS_ACCOUNT}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR"
          docker tag shieldscan-api:${{ github.sha }} "${ECR}/shieldscan-api:${{ github.sha }}"
          docker tag shieldscan-api:latest "${ECR}/shieldscan-api:latest"
          docker push "${ECR}/shieldscan-api:${{ github.sha }}"
          docker push "${ECR}/shieldscan-api:latest"
          echo "Pushed to ECR: ${ECR}/shieldscan-api:${{ github.sha }}"

      - name: Summary
        run: |
          echo "### Docker image built successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** shieldscan-api:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

# ── Secret configuration reference ───────────────────────────
#
# Zero-config: CI runs tests with no secrets required.
#
# Optional secrets (set in GitHub repo → Settings → Secrets → Actions):
#
#   For Docker Hub push:
#     DOCKER_USERNAME     — your Docker Hub username
#     DOCKER_TOKEN        — Hub → Account Settings → Security → New Access Token
#
#   For ECR push (when you have AWS):
#     AWS_ECR_ROLE_ARN    — arn:aws:iam::ACCOUNT:role/github-actions-ecr
#     AWS_REGION          — e.g. eu-west-3
#
#   To keep test credentials stable across runs (optional):
#     CI_JWT_SECRET_KEY   — python -c "import secrets; print(secrets.token_hex(32))"
#     CI_AWS_ENCRYPTION_KEY — python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
