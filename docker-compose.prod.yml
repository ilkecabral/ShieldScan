# ============================================================
# ShieldScan — docker-compose.prod.yml
# Production overlay: no exposed port 8000, restart always, prod env
#
# Usage (override on top of docker-compose.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Or use the Makefile target: make prod-up
#
# Required env vars (set in .env or shell before running):
#   DB_PASSWORD          — PostgreSQL password
#   JWT_SECRET_KEY       — minimum 32 chars (generate: openssl rand -hex 32)
#   AWS_ENCRYPTION_KEY   — Fernet key for encrypting stored AWS credentials
#   ADMIN_PASSWORD       — initial admin account password
#   CORS_ALLOWED_ORIGINS — JSON array e.g. '["https://yourdomain.com"]'
#   SECRETS_MANAGER_SECRET_NAME — AWS Secrets Manager secret name (optional)
# ============================================================

version: "3.9"

services:

  # ── PostgreSQL ─────────────────────────────────────────
  db:
    restart: always           # always restart on failure in prod
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}   # no dev fallback in prod
    # No port exposure — DB is private to the internal network

  # ── ChromaDB vector store ─────────────────────────────
  chromadb:
    restart: always
    # No port exposure — only the API talks to it on the internal network

  # ── FastAPI backend ────────────────────────────────────
  api:
    restart: always
    environment:
      ENV: production
      DATABASE_URL: postgresql://shieldscan:${DB_PASSWORD}@db:5432/shieldscan
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      AWS_ENCRYPTION_KEY: ${AWS_ENCRYPTION_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SECRETS_MANAGER_SECRET_NAME: ${SECRETS_MANAGER_SECRET_NAME:-}
      CLOUDWATCH_LOG_GROUP: ${CLOUDWATCH_LOG_GROUP:-shieldscan-prod}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-3}
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}
    # DO NOT expose port 8000 in production — all traffic goes through Nginx
    ports: !reset []

  # ── Nginx reverse proxy ────────────────────────────────
  nginx:
    restart: always
    # TLS certs must be present at ./ssl/ before starting
    # Use: certbot certonly --standalone -d yourdomain.com
    # Then copy: fullchain.pem → ssl/cert.pem, privkey.pem → ssl/key.pem
