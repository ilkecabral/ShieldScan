# ============================================================
# Alembic configuration for ShieldScan
# Run from the app/ directory:
#   alembic upgrade head          — apply all migrations
#   alembic revision --autogenerate -m "description"  — create new migration
#   alembic downgrade -1          — rollback one step
# ============================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# The DATABASE_URL is read from the environment — same as the app.
# Set it in your .env or export it before running alembic commands.
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
