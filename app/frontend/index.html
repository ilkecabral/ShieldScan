<script>
  function _ssShowError(msg, detail) {
    // De-duplicate: don't add more than one error box
    if (document.getElementById('_ss_err')) return;
    var div = document.createElement('div');
    div.id = '_ss_err';
    div.style = 'padding: 20px; background: #fee2e2; border: 2px solid #ef4444; color: #991b1b; font-family: monospace; position: fixed; top: 20px; left: 20px; right: 20px; z-index: 99999; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); white-space: pre-wrap;';
    div.innerText = '⚠️ JavaScript Error Detected ⚠️\n\n' + msg + '\n\n' + (detail || 'No stack trace available') + '\n\nTip: open DevTools Console (F12) for full details.';
    document.body.appendChild(div);
  }
  window.onerror = function(msg, src, lineno, colno, error) {
    var detail = error && error.stack ? error.stack : (src ? ('at ' + src + ':' + lineno + ':' + colno) : null);
    _ssShowError(msg, detail);
  };
  window.addEventListener('unhandledrejection', function(e) {
    var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason || 'Unhandled Promise rejection');
    var detail = (e.reason && e.reason.stack) ? e.reason.stack : null;
    _ssShowError(msg, detail);
  });
</script>

// Auto-detect API base URL:
// - Port 8000 = bare uvicorn (no nginx) → talk directly to :8000
// - Any other port / real domain = nginx is proxying /api/ → use same-origin ""
const API = (window.location.port === "3000" || window.location.port === "8000") ? "http://localhost:8000" : "";

/* ── Auth token (module-level — all components share) ─────────────────────── */
let authToken = null;

// Restore token from previous session so page reload doesn't log the user out
(function _restoreSession() {
  try {
    const raw = localStorage.getItem("ss_session");
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.token) authToken = parsed.token;
    }
  } catch {}
})();

function _persistSession(userData) {
  try {
    if (authToken && userData)
      localStorage.setItem("ss_session", JSON.stringify({ token: authToken, user: userData }));
  } catch {}
}

function _clearSession() {
  try { localStorage.removeItem("ss_session"); } catch {}
}

function apiFetch(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (authToken) headers["Authorization"] = "Bearer " + authToken;
  // cache:'no-store' prevents stale GET responses after a new scan completes
  return fetch(API + path, { cache: "no-store", ...opts, headers: { ...headers, ...(opts.headers || {}) } });
}

function base64urlToBuffer(b64url) {
  const b64 = (b64url || "").replace(/-/g, "+").replace(/_/g, "/");
  const padded = b64.padEnd(b64.length + (4 - b64.length % 4) % 4, "=");
  const raw = atob(padded);
  const buf = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
  return buf.buffer;
}

function bufferToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let str = "";
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
}

  const [resetToken, setResetToken] = useState(initialResetToken || "");

  const [resetDone, setResetDone] = useState(false);

  // Recovery state
  const [recoverMode, setRecoverMode] = useState("choose"); // "choose" | "login" | "email"
  const [recoverEmail, setRecoverEmail] = useState("");
  const [recoverPwd, setRecoverPwd] = useState("");
  const [recoverEmailSent, setRecoverEmailSent] = useState(false);
  const [recoverDevToken, setRecoverDevToken] = useState("");
  const [recoverToken, setRecoverToken] = useState(initialRecoverToken || "");
  const [recoverDone, setRecoverDone] = useState(false);

  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [info, setInfo] = useState("");
  const [showPwd, setShowPwd] = useState(false);

  // Step 1: password login
  const submitPassword = async (e) => {
    e.preventDefault(); setErr("");
    if (!email || !pwd) { setErr("Please fill in all fields."); return; }
    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password: pwd }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.detail || "Login failed"); setLoading(false); return; }

      if (d.requires_email_verification && d.verify_partial_token) {
        setVerifyToken(d.verify_partial_token);
        setStep("email_verify");
        setLoading(false);
        return;
      }

      if (d.requires_totp && d.partial_token) {
        setPartialToken(d.partial_token);
        setStep("totp");
        setLoading(false);
        return;
      }

      // Full login — no 2FA
      authToken = d.access_token;
      onLogin({ email: d.email, name: d.full_name || d.email.split("@")[0], id: d.user_id });
    } catch {
      setErr("Cannot reach backend — is it running on port 8000?");
    }
    setLoading(false);
  };

  // Email verification step
  const submitVerifyCode = async (e) => {
    e.preventDefault(); setErr("");
    if (verifyCode.length !== 6) { setErr("Enter the 6-digit code sent to your email."); return; }
    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/verify-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + verifyToken },
        body: JSON.stringify({ code: verifyCode }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.detail || "Incorrect code."); setLoading(false); return; }
      authToken = d.access_token;
      onLogin({ email: d.email, name: d.full_name || d.email.split("@")[0], id: d.user_id });
    } catch {
      setErr("Cannot reach backend.");
    }
    setLoading(false);
  };

  const resendVerifyCode = async () => {
    if (!email) return;
    setErr(""); setInfo("");
    try {
      await fetch(API + "/api/auth/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      setInfo("A new code has been sent.");
    } catch { setInfo("Could not resend — check backend."); }
  };

  // Forgot password step
  const submitForgot = async (e) => {
    e.preventDefault(); setErr("");
    if (!forgotEmail) { setErr("Enter your email address."); return; }
    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/password-reset/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: forgotEmail }),
      });
      const d = await res.json();
      setForgotSent(true);
      if (d.reset_token) setForgotDevToken(d.reset_token); // dev mode only
    } catch {
      setErr("Cannot reach backend.");
    }
    setLoading(false);
  };

  // Reset password step
  const submitReset = async (e) => {
    e.preventDefault(); setErr("");
    if (!resetToken) { setErr("Missing reset token."); return; }
    if (resetPwd !== resetConfirm) { setErr("Passwords do not match."); return; }
    if (resetPwd.length < 8) { setErr("Password must be at least 8 characters."); return; }
    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/password-reset/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: resetToken, new_password: resetPwd }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.detail || "Reset failed."); setLoading(false); return; }
      setResetDone(true);
    } catch {
      setErr("Cannot reach backend.");
    }
    setLoading(false);
  };

  // Recovery Path A — sign in to recover
  const submitRecoverLogin = async (e) => {
    e.preventDefault(); setErr("");
    if (!recoverEmail || !recoverPwd) { setErr("Enter your email and password."); return; }
    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/account/recover/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: recoverEmail, password: recoverPwd }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.detail || "Recovery failed."); setLoading(false); return; }
      // Reactivated — log them in directly
      authToken = d.access_token;
      onLogin({ email: d.email, name: d.full_name || d.email.split("@")[0], id: d.user_id });
    } catch { setErr("Cannot reach backend."); }
    setLoading(false);
  };

  // Recovery Path B — request email link
  const submitRecoverEmail = async (e) => {
    e.preventDefault(); setErr("");
    if (!recoverEmail) { setErr("Enter your email address."); return; }
    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/account/recover/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: recoverEmail }),
      });
      const d = await res.json();
      setRecoverEmailSent(true);
      if (d.recovery_token) setRecoverDevToken(d.recovery_token); // dev mode
    } catch { setErr("Cannot reach backend."); }
    setLoading(false);
  };

  // Recovery Path B — confirm via token from email link
  const submitRecoverConfirm = async () => {
    if (!recoverToken) { setErr("Missing recovery token."); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch(API + "/api/auth/account/recover/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: recoverToken }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.detail || "Recovery failed."); setLoading(false); return; }
      setRecoverDone(true);
      // Auto-login after confirm
      authToken = d.access_token;
      setTimeout(() => onLogin({ email: d.email, name: d.full_name || d.email.split("@")[0], id: d.user_id }), 1800);
    } catch { setErr("Cannot reach backend."); }
    setLoading(false);
  };

  // Auto-trigger confirm when landing on recover_confirm step with a token from URL
  React.useEffect(() => {
    if (step === "recover_confirm" && recoverToken && !recoverDone) {
      submitRecoverConfirm();
    }
  }, [step]);

  // Step 2a: TOTP code
  const submitTotp = async (e) => {
    e.preventDefault(); setErr("");
    if (totpCode.length !== 6 && totpCode.length !== 9) { setErr("Enter the 6-digit code from your app, or your 9-character backup code (XXXX-XXXX)."); return; }
    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/totp/complete-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ partial_token: partialToken, code: totpCode }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.detail || "Invalid code."); setLoading(false); return; }
      authToken = d.access_token;
      onLogin({ email: d.email, name: d.full_name || d.email.split("@")[0], id: d.user_id });
    } catch {
      setErr("Cannot reach backend.");
    }
    setLoading(false);
  };

  // Step 2b: Passkey login
  const doPasskeyLogin = async () => {
    setErr(""); setLoading(true);
    try {
      // Get challenge from backend
      const beginRes = await fetch(API + "/api/passkey/login/begin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      if (!beginRes.ok) {
        const d = await beginRes.json();
        setErr(d.detail || "No passkeys registered for this account.");
        setLoading(false); return;
      }
      const options = await beginRes.json();

      // Decode challenge and credential IDs
      const publicKey = {
        ...options,
        challenge: base64urlToBuffer(options.challenge),
        allowCredentials: (options.allowCredentials || []).map(c => ({
          ...c, id: base64urlToBuffer(c.id),
        })),
      };

      let assertion;
      try {
        assertion = await navigator.credentials.get({ publicKey });
      } catch (ex) {
        setErr("Passkey cancelled or not recognised. " + (ex.message || ""));
        setLoading(false); return;
      }

      // Send to backend
      const completeRes = await fetch(API + "/api/passkey/login/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email,
          response: {
            id: assertion.id,
            rawId: bufferToBase64url(assertion.rawId),
            response: {
              clientDataJSON: bufferToBase64url(assertion.response.clientDataJSON),
              authenticatorData: bufferToBase64url(assertion.response.authenticatorData),
              signature: bufferToBase64url(assertion.response.signature),
              userHandle: assertion.response.userHandle ? bufferToBase64url(assertion.response.userHandle) : null,
            },
            type: assertion.type,
          },
        }),
      });
      const d = await completeRes.json();
      if (!completeRes.ok) { setErr(d.detail || "Passkey verification failed."); setLoading(false); return; }
      authToken = d.access_token;
      onLogin({ email: d.email, name: d.full_name || d.email.split("@")[0], id: d.user_id });
    } catch (ex) {
      setErr("Passkey error: " + (ex.message || "Unknown error"));
    }
    setLoading(false);
  };

  const LFIELD = { fontSize:".68rem", letterSpacing:".05em", color:"#6b7280" };

  return (
    <div className="ss-auth-bg">
      <div style={{width:"100%",maxWidth:420}}>
        <div className="text-center mb-4">
          <i className="cil-shield-alt text-white" style={{fontSize:"3.5rem",display:"block",marginBottom:8}}></i>
          <h1 className="text-white fw-bold mb-1" style={{fontSize:"1.8rem"}}>ShieldScan</h1>
          <p className="mb-0" style={{color:"rgba(255,255,255,.6)",fontSize:".85rem"}}>Cloud-Native Application Protection Platform</p>
        </div>
        <div className="card border-0 shadow-lg" style={{borderRadius:16}}>
          <div className="card-body p-4">

            {/* ── Back button for sub-steps ── */}
            {(step === "totp" || step === "email_verify" || step === "forgot" || step === "recover") && (
              <div className="d-flex align-items-center gap-2 mb-3">
                <button onClick={()=>{
                    setStep(step === "recover" ? "forgot" : "password");
                    setErr(""); setInfo("");
                    if (step === "recover") { setRecoverMode("choose"); setRecoverEmailSent(false); }
                  }}
                  className="btn btn-sm btn-light p-1" style={{borderRadius:6}}>
                  <i className="cil-arrow-left" style={{fontSize:".85rem"}}></i>
                </button>
                <span className="fw-semibold" style={{color:"#374151",fontSize:".88rem"}}>
                  {step === "totp"         ? "Two-Factor Verification"
                    : step === "email_verify" ? "Verify your email"
                    : step === "recover"      ? "Recover Account"
                    : "Reset password"}
                </span>
              </div>
            )}

            {step === "password" && (
              <h5 className="fw-semibold mb-4" style={{color:"#1f2937"}}>Sign in to your account</h5>
            )}

            {err && (
              <div className="alert alert-danger py-2 px-3 mb-3" style={{fontSize:".83rem",borderRadius:8}}>
                <i className="cil-warning me-2"></i>{err}
              </div>
            )}
            {info && (
              <div className="alert alert-success py-2 px-3 mb-3" style={{fontSize:".83rem",borderRadius:8}}>
                <i className="cil-check me-2"></i>{info}
              </div>
            )}

            {/* ── Password step ── */}
            {step === "password" && (
              <form onSubmit={submitPassword}>
                <div className="mb-3">
                  <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Email</label>
                  <input type="email" className="form-control" value={email} onChange={e=>setEmail(e.target.value)}
                    placeholder="you@example.com" autoComplete="username" style={{borderRadius:8}}/>
                </div>
                <div className="mb-1">
                  <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Password</label>
                  <div className="input-group">
                    <input type={showPwd ? "text" : "password"} className="form-control" value={pwd}
                      onChange={e=>setPwd(e.target.value)} placeholder="••••••••"
                      autoComplete="current-password" style={{borderRadius:"8px 0 0 8px"}}/>
                    <button type="button" className="btn btn-outline-secondary"
                      onClick={()=>setShowPwd(v=>!v)} style={{borderRadius:"0 8px 8px 0",borderLeft:"none"}}>
                      <i className={showPwd ? "cil-eye-slash" : "cil-low-vision"} style={{fontSize:".85rem"}}></i>
                    </button>
                  </div>
                </div>
                <div className="text-end mb-4">
                  <button type="button" onClick={()=>{setForgotEmail(email);setForgotSent(false);setForgotDevToken("");setErr("");setStep("forgot");}}
                    className="btn btn-link p-0 text-ss" style={{fontSize:".75rem"}}>
                    Forgot password?
                  </button>
                </div>
                <button type="submit" disabled={loading}
                  className="btn btn-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"
                  style={{borderRadius:8,padding:"10px"}}>
                  {loading && <Spinner/>}{loading ? "Signing in…" : "Sign in"}
                </button>

                {email.includes("@") && (
                  <>
                    <div className="d-flex align-items-center my-3 gap-2">
                      <div style={{flex:1,height:1,background:"#e9ecef"}}></div>
                      <span style={{fontSize:".75rem",color:"#9ca3af"}}>or</span>
                      <div style={{flex:1,height:1,background:"#e9ecef"}}></div>
                    </div>
                    <button type="button" onClick={doPasskeyLogin} disabled={loading}
                      className="btn btn-outline-secondary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"
                      style={{borderRadius:8,padding:"10px",fontSize:".88rem"}}>
                      <i className="cil-fingerprint" style={{fontSize:"1.1rem"}}></i>
                      Sign in with Passkey
                    </button>
                  </>
                )}

              </form>
            )}

            {/* ── Email verification step ── */}
            {step === "email_verify" && (
              <form onSubmit={submitVerifyCode}>
                <div className="text-center mb-4">
                  <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                    style={{width:56,height:56,background:"#eff6ff",border:"2px solid #bfdbfe"}}>
                    <i className="cil-envelope-closed" style={{fontSize:"1.4rem",color:"#2563eb"}}></i>
                  </div>
                  <p className="fw-semibold mb-1" style={{color:"#1f2937",fontSize:".95rem"}}>Check your inbox</p>
                  <p className="text-muted mb-0" style={{fontSize:".82rem"}}>
                    We sent a 6-digit code to <strong>{email}</strong>
                  </p>
                </div>
                <div className="mb-4">
                  <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Verification Code</label>
                  <input type="text" inputMode="numeric" className="form-control text-center fw-bold"
                    value={verifyCode}
                    onChange={e=>setVerifyCode(e.target.value.replace(/\D/g,"").slice(0,6))}
                    placeholder="000000" maxLength={6} autoFocus
                    style={{borderRadius:8,fontSize:"1.5rem",letterSpacing:".3em"}}/>
                </div>
                <button type="submit" disabled={loading || verifyCode.length !== 6}
                  className="btn btn-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"
                  style={{borderRadius:8,padding:"10px"}}>
                  {loading && <Spinner/>}{loading ? "Verifying…" : "Verify Email"}
                </button>
                <p className="text-center mt-3 mb-0" style={{fontSize:".75rem",color:"#9ca3af"}}>
                  Didn't receive it?{" "}
                  <button type="button" onClick={resendVerifyCode}
                    className="btn btn-link p-0 text-ss" style={{fontSize:".75rem"}}>
                    Resend code
                  </button>
                </p>
              </form>
            )}

            {/* ── Forgot password step ── */}
            {step === "forgot" && !forgotSent && (
              <form onSubmit={submitForgot}>
                <div className="text-center mb-4">
                  <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                    style={{width:56,height:56,background:"#fef3c7",border:"2px solid #fde68a"}}>
                    <i className="cil-lock-unlocked" style={{fontSize:"1.4rem",color:"#d97706"}}></i>
                  </div>
                  <p className="text-muted mb-0" style={{fontSize:".85rem"}}>
                    Enter your email and we'll send a reset link.
                  </p>
                </div>
                <div className="mb-4">
                  <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Email address</label>
                  <input type="email" className="form-control" value={forgotEmail}
                    onChange={e=>setForgotEmail(e.target.value)}
                    placeholder="you@example.com" autoFocus style={{borderRadius:8}}/>
                </div>
                <button type="submit" disabled={loading}
                  className="btn btn-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"
                  style={{borderRadius:8,padding:"10px"}}>
                  {loading && <Spinner/>}{loading ? "Sending…" : "Send Reset Link"}
                </button>

                <div className="d-flex align-items-center my-3 gap-2">
                  <div style={{flex:1,height:1,background:"#e9ecef"}}></div>
                  <span style={{fontSize:".75rem",color:"#9ca3af"}}>or</span>
                  <div style={{flex:1,height:1,background:"#e9ecef"}}></div>
                </div>

                <button type="button"
                  onClick={()=>{setStep("recover");setRecoverEmail(forgotEmail);setRecoverMode("choose");setErr("");}}
                  className="btn btn-outline-secondary w-100"
                  style={{borderRadius:8, fontSize:".85rem"}}>
                  <i className="cil-history me-2"></i>Recover a deleted account
                </button>
              </form>
            )}

            {step === "forgot" && forgotSent && (
              <div className="text-center py-2">
                <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                  style={{width:64,height:64,background:"#d1fae5",border:"2px solid #6ee7b7"}}>
                  <i className="cil-envelope-letter" style={{fontSize:"1.6rem",color:"#065f46"}}></i>
                </div>
                <h6 className="fw-bold mb-2" style={{color:"#1f2937"}}>Check your email</h6>
                <p className="text-muted mb-3" style={{fontSize:".83rem"}}>
                  If <strong>{forgotEmail}</strong> is registered, a reset link is on its way.
                  Check your spam folder if it doesn't arrive within 2 minutes.
                </p>
                {forgotDevToken && (
                  <div className="alert alert-warning py-2 px-3 text-start mb-3" style={{fontSize:".78rem",borderRadius:8}}>
                    <strong>Dev mode</strong> — email not configured.<br/>
                    Your reset token: <code style={{wordBreak:"break-all"}}>{forgotDevToken}</code><br/>
                    <button type="button" className="btn btn-link p-0 text-ss mt-1" style={{fontSize:".75rem"}}
                      onClick={()=>{setResetToken(forgotDevToken);setStep("reset");}}>
                      Click here to use it now →
                    </button>
                  </div>
                )}
                <button onClick={()=>setStep("password")}
                  className="btn btn-outline-primary w-100" style={{borderRadius:8}}>
                  Back to Sign In
                </button>
              </div>
            )}

            {/* ── Reset password step ── */}
            {step === "reset" && !resetDone && (
              <form onSubmit={submitReset}>
                <div className="text-center mb-4">
                  <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                    style={{width:56,height:56,background:"var(--ss-light)",border:"2px solid rgba(15,110,86,.2)"}}>
                    <i className="cil-lock-locked text-ss" style={{fontSize:"1.4rem"}}></i>
                  </div>
                  <p className="text-muted mb-0" style={{fontSize:".85rem"}}>Choose a strong new password.</p>
                </div>
                {!resetToken && (
                  <div className="mb-3">
                    <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Reset Token</label>
                    <input type="text" className="form-control" value={resetToken}
                      onChange={e=>setResetToken(e.target.value.trim())}
                      placeholder="Paste reset token from email" style={{borderRadius:8}}/>
                  </div>
                )}
                <div className="mb-3">
                  <label className="form-label fw-semibold text-uppercase" style={LFIELD}>New Password</label>
                  <input type="password" className="form-control" value={resetPwd}
                    onChange={e=>setResetPwd(e.target.value)}
                    placeholder="••••••••" style={{borderRadius:8}}/>
                  <PasswordStrengthBar pwd={resetPwd}/>
                </div>
                <div className="mb-4">
                  <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Confirm Password</label>
                  <input type="password" className="form-control" value={resetConfirm}
                    onChange={e=>setResetConfirm(e.target.value)}
                    placeholder="••••••••" style={{borderRadius:8}}/>
                </div>
                <button type="submit" disabled={loading || !resetToken || resetPwd.length < 8}
                  className="btn btn-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"
                  style={{borderRadius:8,padding:"10px"}}>
                  {loading && <Spinner/>}{loading ? "Resetting…" : "Set New Password"}
                </button>
              </form>
            )}

            {step === "reset" && resetDone && (
              <div className="text-center py-2">
                <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                  style={{width:64,height:64,background:"#d1fae5",border:"2px solid #6ee7b7"}}>
                  <i className="cil-check-circle" style={{fontSize:"1.6rem",color:"#065f46"}}></i>
                </div>
                <h6 className="fw-bold mb-2" style={{color:"#1f2937"}}>Password reset!</h6>
                <p className="text-muted mb-4" style={{fontSize:".83rem"}}>
                  Your password has been updated. Sign in with your new password.
                </p>
                <button onClick={()=>{setStep("password");setResetDone(false);setResetPwd("");setResetConfirm("");setResetToken("");}}
                  className="btn btn-primary w-100 fw-semibold" style={{borderRadius:8,padding:"10px"}}>
                  Sign In
                </button>
              </div>
            )}

            {/* ── Recover step ── */}
            {step === "recover" && (
              <div>
                {/* Choose method */}
                {recoverMode === "choose" && (
                  <div>
                    <div className="text-center mb-4">
                      <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                        style={{width:56,height:56,background:"#fef3c7",border:"2px solid #fde68a"}}>
                        <i className="cil-history" style={{fontSize:"1.4rem",color:"#d97706"}}></i>
                      </div>
                      <p className="text-muted mb-0" style={{fontSize:".85rem"}}>
                        How would you like to recover your account?
                      </p>
                    </div>

                    {/* Option cards */}
                    <div className="d-flex flex-column gap-3">
                      <button
                        onClick={()=>{setRecoverMode("login");setErr("");}}
                        className="btn text-start p-3"
                        style={{border:"1.5px solid #d1fae5",borderRadius:12,background:"#f0fdf4"}}>
                        <div className="d-flex align-items-center gap-3">

// Common passwords — top ~250 from known breach lists
// Any password in this set is rejected regardless of length or complexity
const COMMON_PASSWORDS = new Set([
  "password","123456","12345678","qwerty","abc123","monkey","1234567","letmein",
  "trustno1","dragon","baseball","iloveyou","master","sunshine","ashley","bailey",
  "passw0rd","shadow","123123","654321","superman","qazwsx","michael","football",
  "batman","admin","welcome","login","solo","princess","starwars","summer","hello",
  "charlie","donald","password1","qwerty123","iloveyou1","aa123456","123456789",
  "1234567890","password123","111111","1234","12345","123456789","password!",
  "qwertyuiop","123qwe","1q2w3e4r","1q2w3e","zaq1zaq1","monkey1","ferrari",
  "thomas","jordan","hunter","ranger","daniel","andrew","samsung","freedom",
  "george","joshua","jessica","harley","rangers","robert","soccer","hockey",
  "killer","cheese","maggie","michelle","ginger","thunder","porsche","guitar",

  "yellow","access","shadow1","flowers","corvette","snoopy","cookie","naruto",
  "friends","garfield","hotdog","compaq","chocolate","pokemon","maverick","pioneer",
  "dragon1","sparky","bubbles","albert","tiger","hannah","jordan1","steven",
  "falcon","chicago","rangers1","simple","monday","january","november","forever",
  "dolphin","martin","rabbit","qweasd","london","russia","yellow1","silver",
  "golden","joseph","richard","jennifer","melissa","madison","abigail","samantha",
  "orange","tennis","hockey1","purple","asdfgh","computer","security","internet",
  "matrix1","testing","password2","password3","testing1","network","gaming",
  "hacker","system","admin123","root","toor","linux","windows","server",
  "default","backup","changeme","newpass","temp","guest","user","abc",
]);

function calcEntropy(pwd) {
  if (!pwd) return 0;
  let pool = 0;
  if (/[a-z]/.test(pwd)) pool += 26;
  if (/[A-Z]/.test(pwd)) pool += 26;
  if (/[0-9]/.test(pwd)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pwd)) pool += 32;
  return pwd.length * Math.log2(pool || 1);
}

function pwdStrength(pwd) {
  if (!pwd) return { level: 0, label: "", color: "#e5e7eb", pct: 0 };
  const lower = pwd.toLowerCase();
  if (COMMON_PASSWORDS.has(lower)) {
    return { level: 0, label: "Common password — rejected", color: "#dc2626", pct: 8, common: true };
  }
  const e = calcEntropy(pwd);
  if (e < 28) return { level: 1, label: "Very Weak", color: "#dc2626", pct: 16 };
  if (e < 36) return { level: 2, label: "Weak",      color: "#ea580c", pct: 32 };
  if (e < 50) return { level: 3, label: "Fair",      color: "#d97706", pct: 55 };
  if (e < 65) return { level: 4, label: "Strong",    color: "#16a34a", pct: 78 };
               return { level: 5, label: "Very Strong", color: "#0F6E56", pct: 100 };
}

function PasswordStrengthBar({ pwd }) {
  if (!pwd) return null;
  const s = pwdStrength(pwd);
  const has = {
    upper: /[A-Z]/.test(pwd),
    lower: /[a-z]/.test(pwd),
    digit: /[0-9]/.test(pwd),
    special: /[^a-zA-Z0-9]/.test(pwd),
    len: pwd.length >= 12,
  };
  return (
    <div className="mt-2 mb-3">
      {/* Bar */}
      <div style={{height:4,background:"#f3f4f6",borderRadius:4,overflow:"hidden",marginBottom:4}}>
        <div style={{
          height:"100%",
          width: s.pct + "%",
          background: s.color,
          borderRadius:4,
          transition:"width .3s,background .3s",
        }}/>
      </div>
      {/* Label */}
      <div className="d-flex justify-content-between align-items-center mb-2">
        <span style={{fontSize:".72rem",fontWeight:700,color:s.color}}>{s.label}</span>
        <span style={{fontSize:".68rem",color:"#9ca3af",fontFamily:"monospace"}}>
          {Math.round(calcEntropy(pwd))} bits
        </span>
      </div>
      {/* Checklist */}
      <div className="d-flex flex-wrap gap-1">
        {[
          [has.len,    "12+ chars"],
          [has.upper,  "Uppercase"],
          [has.lower,  "Lowercase"],
          [has.digit,  "Number"],
          [has.special,"Symbol"],
        ].map(([ok, lbl]) => (
          <span key={lbl} style={{
            fontSize:".65rem",fontWeight:600,padding:"2px 7px",borderRadius:10,
            background: ok ? "#d1fae5" : "#f3f4f6",
            color: ok ? "#065f46" : "#9ca3af",
          }}>
            {ok ? "✓" : "·"} {lbl}
          </span>
        ))}
      </div>
    </div>
  );
}

function SignupPage({ onSignup, onGoLogin }) {
  const [f, setF] = useState({ name:"", email:"", org:"", pwd:"", confirm:"" });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [showPwd, setShowPwd] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);
  // After signup: "email_verify" → verify code, then "security_setup" → optional 2FA
  const [phase, setPhase] = useState("form"); // "form" | "email_verify" | "security_setup"
  const [signedUpUser, setSignedUpUser] = useState(null);
  const [verifyToken, setVerifyToken] = useState("");
  const [verifyCode, setVerifyCode] = useState("");
  const [verifyErr, setVerifyErr] = useState("");
  const [verifyInfo, setVerifyInfo] = useState("");
  const [verifyLoading, setVerifyLoading] = useState(false);
  const set = k => e => setF(p => ({...p, [k]: e.target.value}));

  const submit = async (e) => {
    e.preventDefault(); setErr("");
    if (!f.name || !f.email || !f.pwd) { setErr("Fill in all required fields."); return; }
    if (f.pwd !== f.confirm) { setErr("Passwords do not match."); return; }
    if (f.pwd.length < 8) { setErr("Password must be at least 8 characters."); return; }

    const s = pwdStrength(f.pwd);
    if (s.common) { setErr("This is a known common password. Please choose something unique."); return; }
    if (s.level < 2) { setErr("Password is too weak — try adding uppercase, numbers, or symbols."); return; }

    setLoading(true);
    try {
      const res = await fetch(API + "/api/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: f.email, password: f.pwd, full_name: f.name }),
      });
      const d = await res.json();
      if (!res.ok) { setErr(d.detail || "Registration failed"); setLoading(false); return; }

      if (d.requires_email_verification && d.verify_partial_token) {
        // Email configured — must verify before entering the app
        setVerifyToken(d.verify_partial_token);
        setPhase("email_verify");
        setLoading(false);
        return;
      }

      // Dev mode or already verified — go straight to security setup
      authToken = d.access_token;
      const user = { email: d.email, name: d.full_name || f.name, id: d.user_id };
      setSignedUpUser(user);
      setPhase("security_setup");
    } catch {
      setErr("Cannot reach backend — is it running on port 8000?");
    }
    setLoading(false);
  };

  const submitVerifyCode = async (e) => {
    e.preventDefault(); setVerifyErr("");
    if (verifyCode.length !== 6) { setVerifyErr("Enter the 6-digit code."); return; }
    setVerifyLoading(true);
    try {
      const res = await fetch(API + "/api/auth/verify-email", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + verifyToken },
        body: JSON.stringify({ code: verifyCode }),
      });
      const d = await res.json();
      if (!res.ok) { setVerifyErr(d.detail || "Incorrect code."); setVerifyLoading(false); return; }
      authToken = d.access_token;
      const user = { email: d.email, name: d.full_name || f.name, id: d.user_id };
      setSignedUpUser(user);
      setPhase("security_setup");
    } catch {
      setVerifyErr("Cannot reach backend.");
    }
    setVerifyLoading(false);
  };

  const resendCode = async () => {
    setVerifyErr(""); setVerifyInfo("");
    try {
      await fetch(API + "/api/auth/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: f.email }),
      });
      setVerifyInfo("A new code has been sent.");
    } catch { setVerifyInfo("Could not resend."); }
  };

  const LFIELD = { fontSize:".68rem", letterSpacing:".05em", color:"#6b7280" };

  // ── Email verification phase ──
  if (phase === "email_verify") {
    return (
      <div className="ss-auth-bg">
        <div style={{width:"100%",maxWidth:440}}>
          <div className="text-center mb-4">
            <i className="cil-shield-alt text-white" style={{fontSize:"3.5rem",display:"block",marginBottom:8}}></i>
            <h1 className="text-white fw-bold mb-1" style={{fontSize:"1.8rem"}}>ShieldScan</h1>
          </div>
          <div className="card border-0 shadow-lg" style={{borderRadius:16}}>
            <div className="card-body p-4">
              <div className="text-center mb-4">
                <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
                  style={{width:64,height:64,background:"#eff6ff",border:"2px solid #bfdbfe"}}>
                  <i className="cil-envelope-closed" style={{fontSize:"1.8rem",color:"#2563eb"}}></i>
                </div>
                <h5 className="fw-bold mb-1" style={{color:"#1f2937"}}>Verify your email</h5>
                <p className="text-muted mb-0" style={{fontSize:".83rem"}}>
                  We sent a 6-digit code to <strong>{f.email}</strong>
                </p>
              </div>
              {verifyErr && (
                <div className="alert alert-danger py-2 px-3 mb-3" style={{fontSize:".83rem",borderRadius:8}}>
                  <i className="cil-warning me-2"></i>{verifyErr}
                </div>
              )}
              {verifyInfo && (

                  <i className="cil-check me-2"></i>{verifyInfo}

              )}
              <form onSubmit={submitVerifyCode}>
                <div className="mb-4">
                  <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Verification Code</label>
                  <input type="text" inputMode="numeric" className="form-control text-center fw-bold"

                </div>
                <button type="submit" disabled={verifyLoading || verifyCode.length !== 6}
                  className="btn btn-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"

              <p className="text-center mt-3 mb-0" style={{fontSize:".75rem",color:"#9ca3af"}}>

                  Resend code

              </p>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── Post-signup: offer 2FA or Passkey setup ──
  if (phase === "security_setup" && signedUpUser) {

              style={{width:64,height:64,background:"rgba(255,255,255,.15)"}}>
              <i className="cil-check-circle text-white" style={{fontSize:"2rem"}}></i>
            </div>
            <h1 className="text-white fw-bold mb-1" style={{fontSize:"1.5rem"}}>Account created!</h1>
            <p className="mb-0" style={{color:"rgba(255,255,255,.7)",fontSize:".85rem"}}>
              Add extra security — or skip to get started.
            </p>
          </div>
          <div className="card border-0 shadow-lg" style={{borderRadius:16}}>
            <div className="card-body p-4">
              <h6 className="fw-semibold mb-1" style={{color:"#1f2937"}}>Protect your account</h6>
              <p className="text-muted mb-4" style={{fontSize:".82rem"}}>

  // ── Main signup form ──
  return (
    <div className="ss-auth-bg">
      <div style={{width:"100%",maxWidth:440}}>
        <div className="text-center mb-4">
          <i className="cil-shield-alt text-white" style={{fontSize:"3.5rem",display:"block",marginBottom:8}}></i>

              <div className="mb-3">
                <label className="form-label fw-semibold text-uppercase" style={LFIELD}>
                  Email <span className="text-danger">*</span>
                </label>
                <input type="email" className="form-control" value={f.email} onChange={set("email")}
                  placeholder="you@example.com" autoComplete="email" style={{borderRadius:8}}/>
              </div>

              {/* Org */}
              <div className="mb-3">
                <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Organisation</label>
                <input type="text" className="form-control" value={f.org} onChange={set("org")}
                  placeholder="EPITA / Startup" style={{borderRadius:8}}/>
              </div>

              {/* Password */}
              <div className="mb-1">
                <label className="form-label fw-semibold text-uppercase" style={LFIELD}>
                  Password <span className="text-danger">*</span>
                </label>
                <div className="input-group">
                  <input type={showPwd ? "text" : "password"} className="form-control" value={f.pwd}
                    onChange={set("pwd")} placeholder="Min. 8 characters"
                    autoComplete="new-password" style={{borderRadius:"8px 0 0 8px"}}/>
                  <button type="button" className="btn btn-outline-secondary"
                    onClick={()=>setShowPwd(v=>!v)} style={{borderRadius:"0 8px 8px 0",borderLeft:"none"}}>
                    <i className={showPwd ? "cil-eye-slash" : "cil-low-vision"} style={{fontSize:".85rem"}}></i>
                  </button>
                </div>
              </div>

              {/* Strength indicator */}
              <PasswordStrengthBar pwd={f.pwd}/>

              {/* Confirm */}
              <div className="mb-4">
                <label className="form-label fw-semibold text-uppercase" style={LFIELD}>
                  Confirm Password <span className="text-danger">*</span>
                </label>
                <div className="input-group">
                  <input type={showConfirm ? "text" : "password"} className="form-control" value={f.confirm}
                    onChange={set("confirm")} placeholder="Repeat password"
                    autoComplete="new-password"
                    style={{
                      borderRadius:"8px 0 0 8px",
                      borderColor: f.confirm && f.pwd !== f.confirm ? "#dc2626" : undefined,
                    }}/>
                  <button type="button" className="btn btn-outline-secondary"
                    onClick={()=>setShowConfirm(v=>!v)} style={{borderRadius:"0 8px 8px 0",borderLeft:"none"}}>
                    <i className={showConfirm ? "cil-eye-slash" : "cil-low-vision"} style={{fontSize:".85rem"}}></i>
                  </button>
                </div>
                {f.confirm && f.pwd !== f.confirm && (
                  <div className="text-danger mt-1" style={{fontSize:".75rem"}}>
                    <i className="cil-warning me-1"></i>Passwords do not match
                  </div>
                )}
              </div>

              <button type="submit" disabled={loading}
                className="btn btn-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"
                style={{borderRadius:8,padding:"10px"}}>
                {loading && <Spinner/>}{loading ? "Creating account…" : "Create account"}
              </button>
            </form>
            <p className="text-center mb-0 mt-3" style={{fontSize:".78rem",color:"#9ca3af"}}>
              Already have an account?{" "}
              <button onClick={onGoLogin} className="btn btn-link p-0 fw-semibold text-ss" style={{fontSize:".78rem"}}>Sign in</button>
            </p>
          </div>
        </div>
      </div>
    </div>
  );
}

function AWSConnect({ onConnected, onDisconnected }) {
  // "loading" | "connected" | "disconnected"
  const [connStatus, setConnStatus] = useState("loading");
  const [acctInfo, setAcctInfo] = useState(null); // { account_id, region, arn }

  // Wizard state
  const [step, setStep] = useState(1);
  const [ak, setAk] = useState("");
  const [sk, setSk] = useState("");
  const [showSk, setShowSk] = useState(false);
  const [region, setRegion] = useState("us-east-1");
  const [validatedInfo, setValidatedInfo] = useState(null); // STS response
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  // Load status on mount
  useEffect(() => {
    apiFetch("/api/auth/me").then(r=>r.json()).then(d => {
      if (d && d.aws_connected) {
        setAcctInfo({ account_id: d.aws_account_id, region: d.aws_region });
        setConnStatus("connected");
      } else {
        setConnStatus("disconnected");
      }
    }).catch(() => setConnStatus("disconnected"));
  }, []);

  // Disconnect
  const disconnect = async () => {
    if (!window.confirm("Remove your AWS credentials? CSPM scans will stop working until you reconnect.")) return;
    setLoading(true); setErr("");
    try {
      const res = await apiFetch("/api/auth/aws", { method:"DELETE" });
      if (res.ok || res.status === 204) {
        setConnStatus("disconnected");
        setAcctInfo(null);
        setStep(1); setAk(""); setSk(""); setValidatedInfo(null);
        if (onDisconnected) onDisconnected();
      } else {
        const d = await res.json();
        setErr(d.detail || "Disconnect failed.");
      }
    } catch { setErr("Backend unreachable."); }
    setLoading(false);
  };

  // Step 1 → Step 2
  const goToRegion = () => {
    if (!ak.trim() || !sk.trim()) { setErr("Access Key ID and Secret Access Key are required."); return; }
    if (!ak.startsWith("AKIA") && !ak.startsWith("ASIA")) {
      setErr("Access Key ID should start with AKIA or ASIA.");
      return;
    }
    setErr(""); setStep(2);
  };

  // Step 2: validate with STS then save
  const testAndConnect = async () => {
    setLoading(true); setErr("");
    try {
      // 1. Validate credentials with STS (does NOT save)
      const valRes = await apiFetch("/api/auth/aws/validate", {
        method: "POST",
        body: JSON.stringify({ aws_access_key: ak, aws_secret_key: sk, aws_region: region }),
      });
      const valData = await valRes.json();
      if (!valRes.ok) {
        setErr(valData.detail || "AWS credentials are invalid.");
        setLoading(false); return;
      }

      // 2. Save encrypted credentials
      const saveRes = await apiFetch("/api/auth/aws", {
        method: "PUT",
        body: JSON.stringify({ aws_access_key: ak, aws_secret_key: sk, aws_region: region, account_id: valData.account_id }),
      });
      if (!saveRes.ok) {
        const d = await saveRes.json();
        setErr(d.detail || "Failed to save credentials.");
        setLoading(false); return;
      }

      setValidatedInfo(valData);
      setStep(3);
    } catch { setErr("Cannot reach backend — is it running on port 8000?"); }
    setLoading(false);
  };

  const LFIELD = { fontSize:".68rem", letterSpacing:".05em", color:"#6b7280" };
  const STEPS = ["Credentials", "Region", "Done"];

  // ── Connected state ──────────────────────────────────────────────────────
  if (connStatus === "loading") {
    return (
      <div className="d-flex align-items-center gap-3 py-4" style={{color:"#9ca3af"}}>
        <Spinner dark/><span style={{fontSize:".88rem"}}>Loading AWS connection status…</span>
      </div>
    );
  }

  if (connStatus === "connected" && acctInfo) {
    const maskedId = acctInfo.account_id
      ? acctInfo.account_id.replace(/^(\d{4})(\d+)(\d{4})$/, "$1-****-$3")
      : "—";
    return (
      <div style={{maxWidth:560}}>
        <h6 className="fw-semibold mb-1" style={{color:"#1f2937"}}>AWS Account</h6>
        <p className="text-muted mb-4" style={{fontSize:".85rem"}}>Your AWS credentials are connected and active.</p>

        {err && (
          <div className="alert alert-danger py-2 px-3 mb-3" style={{fontSize:".83rem",borderRadius:8}}>
            <i className="cil-warning me-2"></i>{err}
          </div>
        )}

        {/* Status card */}
        <div className="ss-card p-4 mb-4">
          <div className="d-flex align-items-center gap-3 mb-4">
            <div className="d-flex align-items-center justify-content-center rounded-circle"
              style={{width:48,height:48,background:"#d1fae5",flexShrink:0}}>
              <i className="cib-amazon-aws" style={{fontSize:"1.3rem",color:"#065f46"}}></i>
            </div>
            <div>
              <div className="fw-semibold" style={{color:"#1f2937"}}>AWS Connected
                <span className="ms-2 badge" style={{background:"#d1fae5",color:"#065f46",fontSize:".65rem",fontWeight:700}}>
                  <i className="cil-check me-1"></i>LIVE
                </span>
              </div>
              <div className="text-muted" style={{fontSize:".78rem"}}>boto3 · Read-only SecurityAudit</div>
            </div>
          </div>

          <div className="row g-3 mb-4">
            {[
              ["Account ID", maskedId],
              ["Primary Region", acctInfo.region || "—"],
              ["Permission", "Read-only"],
              ["API Access", "SecurityAudit policy"],
            ].map(([k, v]) => (
              <div key={k} className="col-6">
                <div className="p-3" style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8}}>
                  <div style={{fontSize:".68rem",fontWeight:600,textTransform:"uppercase",letterSpacing:".04em",color:"#6b7280"}}>{k}</div>
                  <div className="fw-semibold mt-1 font-mono" style={{fontSize:".82rem",color:"#374151"}}>{v}</div>
                </div>
              </div>
            ))}
          </div>

          {/* Permissions checklist */}
          <div className="mb-4 p-3" style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8}}>
            <div className="fw-semibold mb-2" style={{fontSize:".78rem",color:"#15803d"}}>
              <i className="cil-shield-alt me-1"></i>Read-only permissions active
            </div>
            {["S3 bucket policy listing","IAM user & role enumeration","Security Group rules","CloudTrail audit logs","RDS & EC2 configurations","VPC & network ACLs"].map(p => (
              <div key={p} className="d-flex align-items-center gap-2" style={{fontSize:".75rem",color:"#166534",marginBottom:2}}>
                <i className="cil-check" style={{color:"#16a34a",fontSize:".7rem"}}></i>{p}
              </div>
            ))}
          </div>

          <button onClick={disconnect} disabled={loading}
            className="btn btn-outline-danger fw-semibold d-flex align-items-center gap-2"
            style={{borderRadius:8,padding:"8px 20px"}}>
            {loading ? <><Spinner/>Disconnecting…</> : <><i className="cil-x"></i>Disconnect AWS Account</>}
          </button>
        </div>

        <div className="alert py-2 px-3 d-flex gap-2 align-items-start" style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8,fontSize:".78rem",color:"#92400e"}}>
          <i className="cil-info mt-1 flex-shrink-0"></i>
          <span>To update your credentials, disconnect first and then reconnect with the new keys.</span>
        </div>
      </div>
    );
  }

  // ── Disconnected: 3-step wizard ──────────────────────────────────────────
  return (
    <div style={{maxWidth:560}}>
      <h6 className="fw-semibold mb-1" style={{color:"#1f2937"}}>Connect AWS Account</h6>
      <p className="text-muted mb-4" style={{fontSize:".85rem"}}>
        Add your AWS credentials to enable live CSPM scanning with boto3.
      </p>

      {/* Stepper */}
      <div className="d-flex align-items-center mb-4">
        {STEPS.map((s, i) => (
          <React.Fragment key={s}>
            <div className="d-flex align-items-center gap-2">
              <div className="ss-step-dot" style={{
                borderColor: i+1 <= step ? "var(--ss)" : "#d1d5db",
                background: i+1 < step ? "var(--ss)" : "transparent",
                color: i+1 < step ? "#fff" : i+1===step ? "var(--ss)" : "#d1d5db",
              }}>{i+1 < step ? <i className="cil-check" style={{fontSize:".75rem"}}></i> : i+1}</div>
              <span style={{fontSize:".78rem",fontWeight:600,color:i+1<=step?"var(--ss)":"#d1d5db"}}>{s}</span>
            </div>
            {i < 2 && <div className="ss-step-line mx-2" style={{background:i+1<step?"var(--ss)":"#e9ecef"}}></div>}
          </React.Fragment>
        ))}
      </div>

      <div className="ss-card p-4">
        {/* ── Step 1: Credentials ── */}
        {step === 1 && (
          <div>
            <div className="mb-3">
              <label className="form-label fw-semibold text-uppercase" style={LFIELD}>
                AWS Access Key ID <span className="text-danger">*</span>
              </label>
              <input value={ak} onChange={e=>setAk(e.target.value.trim())}
                placeholder="AKIAIOSFODNN7EXAMPLE"
                className="form-control font-mono" style={{borderRadius:8}}
                autoComplete="off" spellCheck="false"/>
            </div>
            <div className="mb-3">
              <label className="form-label fw-semibold text-uppercase" style={LFIELD}>
                AWS Secret Access Key <span className="text-danger">*</span>
              </label>
              <div className="input-group">
                <input type={showSk ? "text" : "password"} value={sk} onChange={e=>setSk(e.target.value.trim())}
                  placeholder="••••••••••••••••••••••••••••••••••••••••"
                  className="form-control" style={{borderRadius:"8px 0 0 8px",fontFamily:"monospace"}}
                  autoComplete="off"/>
                <button type="button" className="btn btn-outline-secondary"
                  onClick={()=>setShowSk(v=>!v)}
                  style={{borderRadius:"0 8px 8px 0",borderLeft:"none"}}>
                  <i className={showSk ? "cil-eye-slash" : "cil-low-vision"} style={{fontSize:".85rem"}}></i>
                </button>
              </div>
            </div>

            {err && (
              <div className="alert alert-danger py-2 px-3 mb-3" style={{fontSize:".83rem",borderRadius:8}}>
                <i className="cil-warning me-2"></i>{err}
              </div>
            )}

            <div className="d-flex align-items-center gap-2 mb-3 px-3 py-2" style={{background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:8,fontSize:".78rem",color:"#15803d"}}>
              <i className="cil-lock-locked flex-shrink-0"></i>
              <span>Stored encrypted with Fernet — <strong>read-only</strong> access only. ShieldScan cannot modify your AWS resources.</span>
            </div>

            <AWSSetupGuide/>

            <button onClick={goToRegion} className="btn btn-primary w-100 fw-semibold"
              style={{borderRadius:8,padding:"10px"}}>
              Continue <i className="cil-arrow-right ms-1"></i>
            </button>
          </div>
        )}

        {/* ── Step 2: Region + Test ── */}
        {step === 2 && (
          <div>
            <p className="text-muted mb-3" style={{fontSize:".85rem"}}>
              Choose the primary AWS region. ShieldScan will validate your credentials live using <code>sts:GetCallerIdentity</code>.
            </p>
            <div className="mb-4">
              <label className="form-label fw-semibold text-uppercase" style={LFIELD}>Primary Region</label>
              <select className="form-select" value={region} onChange={e=>setRegion(e.target.value)}
                style={{borderRadius:8,fontFamily:"monospace",fontSize:".88rem"}}>
                {ALL_AWS_REGIONS.map(r=>(
                  <option key={r} value={r}>{r}</option>
                ))}
              </select>
              <div className="mt-2 text-muted" style={{fontSize:".75rem"}}>
                This region is used for STS validation and as the default scan target.
              </div>
            </div>

            {err && (
              <div className="alert alert-danger py-2 px-3 mb-3" style={{fontSize:".83rem",borderRadius:8}}>
                <i className="cil-warning me-2"></i>{err}
              </div>
            )}

            <div className="d-flex gap-2">
              <button onClick={()=>{setStep(1);setErr("");}}
                className="btn btn-outline-secondary fw-semibold" style={{borderRadius:8,padding:"10px 18px"}}>
                <i className="cil-arrow-left me-1"></i>Back
              </button>
              <button onClick={testAndConnect} disabled={loading}
                className="btn btn-primary flex-fill fw-semibold d-flex align-items-center justify-content-center gap-2"
                style={{borderRadius:8,padding:"10px"}}>
                {loading
                  ? <><Spinner/>Validating with AWS…</>
                  : <><i className="cil-shield-alt"></i>Validate &amp; Connect</>}
              </button>
            </div>
          </div>
        )}

        {/* ── Step 3: Success ── */}
        {step === 3 && validatedInfo && (
          <div className="text-center py-2">
            <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
              style={{width:68,height:68,background:"#d1fae5"}}>
              <i className="cil-check-circle" style={{fontSize:"2.2rem",color:"#16a34a"}}></i>
            </div>
            <h6 className="fw-bold mb-1" style={{color:"#1f2937"}}>AWS account connected</h6>
            <p className="text-muted mb-4" style={{fontSize:".83rem"}}>
              Credentials validated via <code>sts:GetCallerIdentity</code> and stored encrypted.
            </p>

            <div className="row g-3 mb-4 text-start">
              {[
                ["Account ID", validatedInfo.account_id || "—"],
                ["Region", region],
                ["IAM Principal", (validatedInfo.arn||"").split("/").pop() || "—"],
                ["Permission", "Read-only"],
              ].map(([k,v]) => (
                <div key={k} className="col-6">
                  <div className="p-3" style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8}}>
                    <div style={{fontSize:".65rem",fontWeight:600,textTransform:"uppercase",letterSpacing:".05em",color:"#6b7280"}}>{k}</div>
                    <div className="fw-semibold mt-1 font-mono" style={{fontSize:".8rem",color:"#374151",wordBreak:"break-all"}}>{v}</div>
                  </div>
                </div>
              ))}
            </div>

            <button onClick={()=>{
              setConnStatus("connected");
              setAcctInfo({ account_id: validatedInfo.account_id, region });
              if (onConnected) onConnected();
            }} className="btn btn-primary w-100 fw-semibold" style={{borderRadius:8,padding:"10px"}}>
              Go to Dashboard <i className="cil-speedometer ms-1"></i>
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── Chat hook ────────────────────────────────────────────────────────────── */

function useChat(init) {
  const [msgs, setMsgs] = useState([{ role:"assistant", content:init }]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);

  const send = useCallback(async (text) => {
    const q = (text || input).trim();
    if (!q || loading) return;
    setMsgs(p => [...p, { role:"user", content:q }]);
    setInput("");
    setLoading(true);
    try {
      const res = await apiFetch("/api/ai/chat", {
        method: "POST",
        body: JSON.stringify({ message: q }),
      });
      const d = await res.json();
      setMsgs(p => [...p, { role:"assistant", content: d.reply || d.detail || "No response" }]);
    } catch {
      setMsgs(p => [...p, { role:"assistant", content:"Backend offline — start uvicorn and try again." }]);
    }
    setLoading(false);
  }, [input, loading]);

  return { msgs, input, setInput, loading, send };
}

const Bubble = ({ msg }) => {
  const bot = msg.role === "assistant";
  return (
    <div className={"d-flex gap-2 mb-3 " + (bot ? "" : "flex-row-reverse")}>

        {bot ? <i className="cil-shield-alt" style={{fontSize:".85rem"}}></i> : "Me"}

      <div className={bot ? "ss-bubble-ai" : "ss-bubble-user"} style={{maxWidth:"76%"}}>
        <pre>{msg.content}</pre>
      </div>
    </div>
  );
};

const SCAN_STEPS = [
  { label:"Preparing scan",                       key:"preparing" },
  { label:"Connecting to AWS account",            key:"connecting" },
  { label:"Initialising AWS session",             key:"initialising" },
  { label:"Scanning S3 bucket permissions",       key:"scanning s3 bucket" },
  { label:"Auditing IAM root account",            key:"auditing iam root" },
  { label:"Checking IAM user MFA settings",       key:"checking iam user mfa" },
  { label:"Checking IAM admin policies",          key:"checking iam admin" },
  { label:"Scanning EC2 security groups",         key:"scanning ec2" },
  { label:"Verifying CloudTrail logging",         key:"verifying cloudtrail" },
  { label:"Checking IAM password policies",       key:"checking iam password" },
  { label:"Checking EBS volume encryption",       key:"checking ebs" },
  { label:"Checking RDS instance encryption",     key:"checking rds" },
  { label:"Checking VPC flow logs",               key:"checking vpc" },
  { label:"Checking S3 access logging",           key:"checking s3 access" },
  { label:"Checking KMS key rotation",            key:"checking kms" },
  { label:"Pulling GuardDuty findings",           key:"pulling guardduty" },
  { label:"Running container vulnerability scan", key:"running container" },
  { label:"Calculating risk score",               key:"calculating" },
  { label:"Saving results to database",           key:"saving" },
];

function ScanProgressModal({ onClose }) {
  const [prog, setProg]       = useState({ step:"Starting scan…", pct:0, done:false });
  const [failed, setFailed]   = useState(false);
  const [stallSecs, setStall] = useState(0);  // seconds since last progress change
  const timerRef    = useRef(null);
  const stallRef    = useRef(null);
  const lastPctRef  = useRef(0);

  useEffect(() => {
    // Poll the backend every 400 ms
    timerRef.current = setInterval(async () => {
      try {
        const r = await apiFetch("/api/scan/progress");
        if (!r.ok) return;
        const d = await r.json();
        setProg(d);
        if (d.pct !== lastPctRef.current) { setStall(0); lastPctRef.current = d.pct; }
        // Detect a backend-reported failure
        if (d.done && (d.step || "").toLowerCase().startsWith("scan failed")) setFailed(true);
        // Only stop polling once the scan has actually made progress and is marked done.
        // This prevents the race condition where the first poll sees the default
        // {done:false, pct:0} "Ready" state (before the scan has started) and stops early.
        if (d.done && d.pct > 0) clearInterval(timerRef.current);
      } catch {}
    }, 400);

    // Stall counter — increments every second, resets on progress change
    stallRef.current = setInterval(() => setStall(s => s + 1), 1000);

    return () => { clearInterval(timerRef.current); clearInterval(stallRef.current); };
  }, []);

  // Determine which step is active based on step text (not % — % is just the bar)
  const stepText = (prog.step || "").toLowerCase();
  const activeIdx = SCAN_STEPS.findIndex(s => stepText.includes(s.key));

  const isDone = prog.done && !failed;
  const isStalled = !prog.done && stallSecs > 20;

  const headerBg = failed
    ? "linear-gradient(135deg,#450a0a 0%,#7f1d1d 100%)"
    : isDone
      ? "linear-gradient(135deg,#052e16 0%,#14532d 100%)"
      : "linear-gradient(135deg,#0f172a 0%,#1e3a5f 100%)";

  return (
    <div style={{
      position:"fixed",inset:0,zIndex:9999,
      background:"rgba(10,15,28,.85)",
      display:"flex",alignItems:"center",justifyContent:"center",
      backdropFilter:"blur(2px)",
    }}>
      <div className="ss-card p-0 overflow-hidden" style={{width:500,maxWidth:"95vw",borderRadius:16,boxShadow:"0 25px 50px rgba(0,0,0,.5)"}}>

        {/* Header */}
        <div style={{background:headerBg, padding:"20px 24px", position:"relative"}}>
          {/* Always-visible close (X) button */}
          <button onClick={onClose}
            title="Dismiss — scan continues in background"
            style={{
              position:"absolute",top:12,right:12,
              background:"rgba(255,255,255,.12)",border:"1px solid rgba(255,255,255,.2)",
              borderRadius:8,color:"#fff",width:32,height:32,cursor:"pointer",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1rem",
              lineHeight:1,
            }}>✕</button>

          <div className="d-flex align-items-center gap-3">
            <div className="d-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
              style={{width:44,height:44,background:"rgba(255,255,255,.1)",border:"1.5px solid rgba(255,255,255,.2)"}}>
              {failed
                ? <i className="cil-warning" style={{fontSize:"1.2rem",color:"#f87171"}}></i>
                : isDone
                  ? <i className="cil-check-alt" style={{fontSize:"1.2rem",color:"#4ade80"}}></i>
                  : <Spinner/>
              }
            </div>
            <div>
              <div style={{color:"#fff",fontWeight:700,fontSize:"1rem"}}>
                {failed ? "Scan Failed" : isDone ? "Scan Complete" : "Scanning Your AWS Account"}
              </div>
              <div style={{color:"rgba(255,255,255,.6)",fontSize:".75rem",marginTop:2}}>
                {failed
                  ? prog.step
                  : isDone
                    ? "All checks finished — results are ready"
                    : isStalled
                      ? "Taking longer than expected — still running…"
                      : "Checking your security posture in real time"
                }
              </div>
            </div>
          </div>
        </div>

        {/* Progress bar */}
        <div style={{height:5,background:"#e2e8f0"}}>
          <div style={{
            height:"100%",
            background: failed?"#ef4444":isDone?"#16a34a":"var(--ss)",
            width:prog.pct+"%",
            transition:"width .5s ease",
          }}></div>
        </div>

        <div className="px-4 pt-3 pb-3">
          {/* Current step text + % */}
          {!failed && (
            <div className="d-flex align-items-center justify-content-between mb-3">
              <span style={{fontSize:".82rem",fontWeight:600,color:"#374151"}}>{prog.step}</span>
              <span style={{fontSize:".78rem",color:"#6b7280",fontVariantNumeric:"tabular-nums"}}>{prog.pct}%</span>
            </div>
          )}

          {/* Step checklist */}
          {!failed && (
            <div style={{marginBottom:16}}>
              {SCAN_STEPS.map((s, i) => {
                const stepDone = isDone || i < activeIdx;
                const stepActive = !isDone && i === activeIdx;
                return (
                  <div key={i} className="d-flex align-items-center gap-2" style={{padding:"3px 0",fontSize:".79rem"}}>
                    <span style={{
                      width:20, height:20, borderRadius:"50%", flexShrink:0,
                      display:"flex", alignItems:"center", justifyContent:"center",
                      background: stepDone?"#d1fae5":stepActive?"#dbeafe":"#f3f4f6",
                      border: stepActive?"2px solid var(--ss)":"1.5px solid transparent",
                      transition:"all .3s",
                    }}>
                      {stepDone
                        ? <i className="cil-check" style={{fontSize:".58rem",color:"#15803d"}}></i>
                        : stepActive
                          ? <span style={{width:7,height:7,borderRadius:"50%",background:"var(--ss)"}}></span>
                          : <span style={{width:5,height:5,borderRadius:"50%",background:"#d1d5db"}}></span>
                      }
                    </span>
                    <span style={{
                      color: stepDone?"#374151":stepActive?"var(--ss)":"#9ca3af",
                      fontWeight: stepActive ? 600 : 400,
                      transition:"color .3s",
                    }}>{s.label}</span>
                  </div>
                );
              })}
            </div>
          )}

          {/* Error state */}
          {failed && (
            <div className="mb-3 p-3 rounded" style={{background:"#fee2e2",border:"1px solid #fca5a5",fontSize:".83rem",color:"#991b1b"}}>
              <div className="fw-semibold mb-1">The scan could not complete.</div>
              <div>Check that your AWS credentials are valid and have the SecurityAudit policy attached, then try again.</div>
            </div>
          )}

          {/* Action buttons */}
          <div className="d-flex gap-2">
            {isDone && (
              <button onClick={onClose} className="btn btn-primary flex-fill fw-semibold" style={{borderRadius:8}}>
                <i className="cil-check me-2"></i>View Results
              </button>
            )}
            {!isDone && (
              <button onClick={onClose} className="btn btn-outline-secondary flex-fill fw-semibold"
                style={{borderRadius:8,fontSize:".83rem"}}>
                {failed ? "Close" : "Dismiss — scan runs in background"}
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ── Scan History Page ────────────────────────────────────────────────────── */

function ScanHistoryPage() {
  const [scans, setScans]               = useState([]);
  const [loading, setLoading]           = useState(true);
  const [expanded, setExpanded]         = useState(null);
  const [findings, setFindings]         = useState({});
  const [findingsLoading, setFindingsLoading] = useState({});
  const [downloading, setDownloading]   = useState({});
  const [deleting, setDeleting]         = useState({});
  const [confirmDelete, setConfirmDelete] = useState(null); // scan object to confirm

  const fetchScans = async () => {
    setLoading(true);
    try {
      const r = await apiFetch("/api/scan/history?limit=50");
      const d = await r.json();
      setScans(d.scans || []);
    } catch {}
    setLoading(false);
  };

  useEffect(() => { fetchScans(); }, []);

  const toggleScan = async (scan) => {
    const sid = scan.id;
    if (expanded === sid) { setExpanded(null); return; }
    setExpanded(sid);
    if (findings[sid]) return;
    setFindingsLoading(p=>({...p,[sid]:true}));
    try {
      const r = await apiFetch(`/api/scan/findings?scan_id=${sid}`);
      const d = await r.json();
      setFindings(p=>({...p,[sid]: d.findings||[]}));
    } catch {}
    setFindingsLoading(p=>({...p,[sid]:false}));
  };

  const downloadReport = async (scan) => {
    const sid = scan.id;
    setDownloading(p=>({...p,[sid]:true}));
    try {
      const r = await apiFetch(`/api/scan/report?scan_id=${sid}`);
      if (!r.ok) { const e=await r.json().catch(()=>({})); alert(e.detail||"Failed to generate report"); return; }
      const blob = await r.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href=url; a.download=`shieldscan-audit-${sid}-${scan.started_at.slice(0,10)}.pdf`; a.click();
      URL.revokeObjectURL(url);
    } catch(e) { alert("Report failed: "+e.message); }
    setDownloading(p=>({...p,[sid]:false}));
  };

  const deleteScan = async (scan) => {
    const sid = scan.id;
    setConfirmDelete(null);
    setDeleting(p=>({...p,[sid]:true}));
    try {
      const r = await apiFetch(`/api/scan/${sid}`, { method:"DELETE" });
      if (r.ok) {
        // Refetch from server — guarantees list is in sync with DB
        if (expanded === sid) setExpanded(null);
        await fetchScans();
      } else {
        let msg = "Delete failed";
        try { const e = await r.json(); msg = e.detail || msg; } catch {}
        alert(msg + ` (HTTP ${r.status})`);
      }
    } catch(e) { alert("Network error during delete: " + e.message); }
    setDeleting(p=>({...p,[sid]:false}));
  };

  const SEV_COLOR = { CRITICAL:"#dc2626", HIGH:"#ea580c", MEDIUM:"#d97706", LOW:"#2563eb" };
  const SEV_BG   = { CRITICAL:"#fee2e2", HIGH:"#fff7ed", MEDIUM:"#fffbeb", LOW:"#eff6ff" };

  const riskColor = (s) => s>=75?"#dc2626":s>=45?"#ea580c":s>=20?"#d97706":"#16a34a";

  if (loading) return (
    <div className="d-flex align-items-center justify-content-center gap-3" style={{height:200,color:"#9ca3af"}}>
      <Spinner dark/><span style={{fontSize:".88rem"}}>Loading scan history…</span>
    </div>
  );

  if (!scans.length) return (
    <div className="ss-card p-5 text-center" style={{borderStyle:"dashed",borderColor:"#e5e7eb"}}>
      <i className="cil-reload" style={{fontSize:"2.5rem",color:"#cbd5e1"}}></i>
      <h6 className="fw-semibold mt-3 mb-2" style={{color:"#374151"}}>No scans yet</h6>
      <p className="text-muted mb-0" style={{fontSize:".85rem"}}>Click "Run Scan" in the top bar to start your first security scan.</p>
    </div>
  );

  // Last completed scan summary
  const lastCompleted = scans.find(s => s.status === "COMPLETED");
  const lastScanDate  = lastCompleted
    ? new Date(lastCompleted.started_at).toLocaleString("en-GB", {
        day:"2-digit", month:"short", year:"numeric",
        hour:"2-digit", minute:"2-digit",
      })
    : null;

  return (
    <div>
      {/* Confirm delete dialog */}
      {confirmDelete && (
        <div style={{position:"fixed",inset:0,zIndex:9998,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center"}}>
          <div className="ss-card p-4" style={{width:380,borderRadius:14,boxShadow:"0 20px 40px rgba(0,0,0,.3)"}}>
            <div className="d-flex align-items-center gap-3 mb-3">
              <div style={{width:40,height:40,borderRadius:"50%",background:"#fee2e2",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <i className="cil-trash" style={{color:"#dc2626",fontSize:"1.1rem"}}></i>
              </div>
              <div>
                <div className="fw-bold" style={{color:"#111827"}}>Delete this scan?</div>
                <div className="text-muted" style={{fontSize:".78rem"}}>
                  {new Date(confirmDelete.started_at).toLocaleString()} · {(confirmDelete.critical_count||0)+(confirmDelete.high_count||0)+(confirmDelete.medium_count||0)+(confirmDelete.low_count||0)} findings
                </div>
              </div>
            </div>
            <p style={{fontSize:".83rem",color:"#6b7280",marginBottom:16}}>
              This will permanently delete the scan and all its findings. The audit report will also be gone. This cannot be undone.
            </p>
            <div className="d-flex gap-2">
              <button onClick={()=>setConfirmDelete(null)}
                className="btn btn-outline-secondary flex-fill fw-semibold" style={{borderRadius:8,fontSize:".83rem"}}>
                Cancel
              </button>
              <button onClick={()=>deleteScan(confirmDelete)}
                className="btn flex-fill fw-semibold" style={{borderRadius:8,fontSize:".83rem",background:"#dc2626",border:"none",color:"#fff"}}>
                <i className="cil-trash me-1"></i>Delete
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div className="d-flex align-items-start justify-content-between mb-4">
        <div>
          <h6 className="fw-bold mb-1" style={{color:"#1f2937"}}>
            {scans.length} scan{scans.length!==1?"s":""} on record
          </h6>
          {lastScanDate && (
            <div className="d-flex align-items-center gap-2" style={{fontSize:".78rem",color:"#6b7280"}}>
              <i className="cil-history" style={{color:"#9ca3af"}}></i>
              Last completed scan: <strong style={{color:"#374151"}}>{lastScanDate}</strong>
            </div>
          )}
          <div className="text-muted mt-1" style={{fontSize:".75rem"}}>
            Click a row to expand findings · Download row for full PDF audit report · Trash icon to delete
          </div>
        </div>
        <button onClick={fetchScans} className="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1"
          style={{borderRadius:8,fontSize:".78rem"}}>
          <i className="cil-reload"></i> Refresh
        </button>
      </div>

      {scans.map(scan => {
        const isOpen = expanded === scan.id;
        const status = scan.status;
        const date = new Date(scan.started_at).toLocaleString();
        const duration = scan.completed_at
          ? Math.round((new Date(scan.completed_at)-new Date(scan.started_at))/1000)+"s" : "—";
        const total = (scan.critical_count||0)+(scan.high_count||0)+(scan.medium_count||0)+(scan.low_count||0);

        return (

                style={{width:38,height:38,
                  background:status==="COMPLETED"?"#d1fae5":status==="FAILED"?"#fee2e2":"#fef9c3",
                  border:`1.5px solid ${status==="COMPLETED"?"#86efac":status==="FAILED"?"#fca5a5":"#fde047"}`}}>
                <i className={status==="COMPLETED"?"cil-check-alt":status==="FAILED"?"cil-x":"cil-reload"}
                  style={{fontSize:".9rem",color:status==="COMPLETED"?"#15803d":status==="FAILED"?"#dc2626":"#ca8a04"}}></i>
              </div>

              {/* Date + status */}
              <div style={{flex:"0 0 200px"}}>
                <div style={{fontWeight:600,fontSize:".85rem",color:"#1f2937"}}>{date}</div>
                <div className="d-flex align-items-center gap-2 mt-1">
                  <span className="ss-badge" style={{fontSize:".68rem",
                    background:status==="COMPLETED"?"#d1fae5":status==="FAILED"?"#fee2e2":"#fef9c3",
                    color:status==="COMPLETED"?"#15803d":status==="FAILED"?"#dc2626":"#b45309"}}>
                    {status}
                  </span>
                  <span style={{fontSize:".72rem",color:"#9ca3af"}}>⏱ {duration}</span>

              {/* Risk score */}
