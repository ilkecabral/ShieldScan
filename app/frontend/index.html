              </div>

              {/* Severity pills */}
              <div className="d-flex gap-2 flex-wrap flex-fill">
                {[["CRITICAL",scan.critical_count||0],["HIGH",scan.high_count||0],["MEDIUM",scan.medium_count||0],["LOW",scan.low_count||0]].map(([s,n])=>(
                  <span key={s} style={{fontSize:".72rem",fontWeight:600,padding:"2px 8px",borderRadius:99,

                    {n} {s}
                  </span>
                ))}
                <span style={{fontSize:".72rem",color:"#9ca3af",marginLeft:"auto"}}>{total} total findings</span>
              </div>

              {/* Actions */}
              <div className="d-flex gap-2 flex-shrink-0 align-items-center" onClick={e=>e.stopPropagation()}>
                {status==="COMPLETED" && (
                  <button onClick={()=>downloadReport(scan)} disabled={downloading[scan.id]}

                    {downloading[scan.id] ? <Spinner dark/> : <i className="cil-cloud-download"></i>}

                  className="btn btn-sm d-flex align-items-center justify-content-center"
                  style={{borderRadius:7,fontSize:".78rem",width:32,height:32,padding:0,
                    border:"1px solid #fecaca",background:"#fff5f5",color:"#dc2626"}}>
                  {deleting[scan.id] ? <Spinner dark/> : <i className="cil-trash"></i>}
                </button>
                <button className="btn btn-sm d-flex align-items-center justify-content-center"
                  style={{borderRadius:7,fontSize:".78rem",width:32,height:32,padding:0,color:"#6b7280",border:"1px solid #e5e7eb"}}>
                  <i className={"cil-chevron-" + (isOpen?"top":"bottom")}></i>
                </button>
              </div>
            </div>

            {/* Expanded findings */}
            {isOpen && (
              <div style={{borderTop:"1px solid #f1f5f9",background:"#fafafa"}}>
                {findingsLoading[scan.id] ? (
                  <div className="d-flex align-items-center gap-2 p-4 text-muted" style={{fontSize:".83rem"}}>
                    <Spinner dark/> Loading findings…
                  </div>
                ) : (findings[scan.id]||[]).length === 0 ? (
                  <div className="p-4 text-muted" style={{fontSize:".83rem"}}>No findings recorded for this scan.</div>
                ) : (
                  <div style={{maxHeight:320,overflowY:"auto"}}>
                    {(findings[scan.id]||[]).map(f=>(
                      <div key={f.id} className="d-flex align-items-center gap-3 px-4 py-2" style={{borderBottom:"1px solid #f1f5f9"}}>
                        <span className="ss-badge flex-shrink-0" style={{
                          minWidth:68,textAlign:"center",
                          background:SEV_BG[f.severity]||"#f3f4f6",
                          color:SEV_COLOR[f.severity]||"#6b7280",
                          fontSize:".68rem",fontWeight:700,
                        }}>{f.severity}</span>
                        <span style={{flex:1,fontSize:".82rem",color:"#374151"}}>{f.title}</span>
                        <span style={{fontSize:".72rem",color:"#9ca3af",flexShrink:0}}>{f.resource||""}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── Findings Table ───────────────────────────────────────────────────────── */

const SEVS = ["ALL","CRITICAL","HIGH","MEDIUM","LOW"];

function FindingsTable({ findings, onTip, tips, tipLoading, expanded }) {
  const [filter, setFilter] = useState("ALL");
  const [search, setSearch] = useState("");
  const counts = findings.reduce((a,f)=>({...a,[f.severity]:(a[f.severity]||0)+1}),{});
  const rows = findings
    .filter(f => filter==="ALL" || f.severity===filter)
    .filter(f => !search || f.resource.toLowerCase().includes(search.toLowerCase()) || f.finding.toLowerCase().includes(search.toLowerCase()));

  return (
    <div className="ss-card">
      <div className="ss-card-hd d-flex align-items-center justify-content-between gap-3 flex-wrap">
        <div className="d-flex align-items-center gap-3">
          <span className="fw-semibold" style={{fontSize:".9rem",color:"#374151"}}>
            Findings <span className="text-muted fw-normal">({rows.length})</span>
          </span>
          <div className="input-group input-group-sm" style={{width:160}}>
            <span className="input-group-text bg-white" style={{borderRadius:"8px 0 0 8px"}}>
              <i className="cil-magnifying-glass" style={{fontSize:".8rem",color:"#9ca3af"}}></i>
            </span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search…"
              className="form-control form-control-sm" style={{borderRadius:"0 8px 8px 0",borderLeft:"none"}}/>
          </div>
        </div>
        <div className="d-flex gap-1 flex-wrap">
          {SEVS.map(s => (
            <button key={s} onClick={()=>setFilter(s)}
              className={"btn btn-sm fw-semibold " + (filter===s ? "btn-primary" : "btn-outline-secondary")}
              style={{borderRadius:6,fontSize:".72rem",padding:"3px 10px"}}>
              {s}{s!=="ALL" && counts[s] ? " ("+counts[s]+")" : ""}
            </button>
          ))}
        </div>
      </div>
      <div className="table-responsive">
        <table className="ss-tbl">
          <thead>
            <tr>
              {["ID","Resource","Finding","Severity","Service","Risk","Fix"].map(h=>(
                <th key={h}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(f => (
              <React.Fragment key={f.id}>
                <tr>
                  <td className="font-mono text-muted" style={{fontSize:".72rem",whiteSpace:"nowrap"}}>{f.id}</td>
                  <td style={{maxWidth:180}}>
                    <div className="fw-semibold truncate" style={{color:"#1f2937"}} title={f.resource}>{f.resource}</div>
                    <div className="text-muted" style={{fontSize:".72rem",marginTop:2}}>{f.resource_type} · {f.region}</div>
                  </td>
                  <td style={{color:"#374151",maxWidth:220}}>{f.finding}</td>
                  <td style={{whiteSpace:"nowrap"}}><Badge s={f.severity}/></td>
                  <td style={{whiteSpace:"nowrap"}}><SvcBadge s={f.service}/></td>
                  <td className="fw-bold" style={{whiteSpace:"nowrap",color:riskColor(f.risk_score)}}>{f.risk_score}</td>
                  <td style={{whiteSpace:"nowrap"}}>
                    <button onClick={()=>onTip(f)}
                      className="btn btn-sm btn-outline-primary fw-semibold"
                      style={{borderRadius:6,fontSize:".72rem",padding:"3px 10px"}}>
                      <i className={"me-1 " + (tipLoading[f.id] ? "cil-reload" : expanded===f.id ? "cil-x" : "cil-bolt")}></i>
                      {tipLoading[f.id] ? "…" : expanded===f.id ? "Hide" : "Fix"}
                    </button>
                  </td>
                </tr>
                {expanded===f.id && (
                  <tr style={{background:"#f8fafc"}}>
                    <td colSpan="7" style={{borderTop:"2px solid #0F6E56",padding:"0"}}>
                      <div style={{padding:"16px 20px"}}>
                        {/* Quick fix bar — instant, no AI needed */}
                        {f.remediation && (
                          <div className="d-flex align-items-start gap-2 mb-3 p-3"
                            style={{background:"#f0fdf4",borderRadius:8,border:"1px solid #bbf7d0"}}>
                            <i className="cil-check-circle mt-1 flex-shrink-0" style={{color:"#16a34a",fontSize:"1rem"}}></i>
                            <div>
                              <div className="fw-semibold mb-1" style={{fontSize:".78rem",color:"#15803d",textTransform:"uppercase",letterSpacing:".04em"}}>Quick Fix</div>
                              <div style={{fontSize:".83rem",color:"#166534",lineHeight:1.5}}>{f.remediation}</div>
                            </div>
                          </div>
                        )}
                        {/* AI step-by-step */}
                        <div className="d-flex align-items-center gap-2 mb-2">
                          <div style={{width:20,height:20,background:"linear-gradient(135deg,#0F6E56,#1d4ed8)",borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                            <i className="cil-bolt" style={{color:"#fff",fontSize:".65rem"}}></i>
                          </div>
                          <span className="fw-semibold" style={{fontSize:".8rem",color:"#1e293b"}}>
                            AI Step-by-Step Guide <span style={{fontWeight:400,color:"#94a3b8"}}>— {f.resource}</span>
                          </span>
                          {!tips[f.id] && !tipLoading[f.id] && (
                            <span className="text-muted" style={{fontSize:".72rem"}}>(asking AI…)</span>
                          )}
                        </div>
                        {tipLoading[f.id] ? (
                          <div className="d-flex align-items-center gap-2 py-2" style={{color:"#6b7280",fontSize:".83rem"}}>
                            <div className="spinner-border spinner-border-sm" style={{width:14,height:14,borderWidth:2,color:"#0F6E56"}}></div>
                            Generating detailed remediation steps…
                          </div>
                        ) : tips[f.id] ? (
                          <div style={{fontSize:".83rem",lineHeight:1.7,color:"#374151",whiteSpace:"pre-wrap",
                            background:"#fff",borderRadius:8,border:"1px solid #e2e8f0",padding:"12px 14px"}}>
                            {tips[f.id]}
                          </div>
                        ) : null}
                      </div>
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
            {rows.length===0 && (
              <tr>
                <td colSpan="7" className="text-center text-muted py-5" style={{fontSize:".85rem"}}>
                  <i className="cil-magnifying-glass d-block mx-auto mb-2" style={{fontSize:"1.5rem"}}></i>
                  No findings match this filter.
                </td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ── Dashboard ────────────────────────────────────────────────────────────── */

function Dashboard({ findings, stats, onTip, tips, tipLoading, expanded }) {
  const compPct = useMemo(() => {
    if (!findings.length) return 0;
    const ids = findings.map(f=>(f.id||"").toUpperCase());
    const controls = CIS_CONTROLS_BASE.map(c=>({ ...c, status: c.check ? (c.check(ids)||"PASS") : "UNKNOWN" }));
    const pass = controls.filter(c=>c.status==="PASS").length;
    const fail = controls.filter(c=>c.status==="FAIL").length;
    return (pass+fail) > 0 ? Math.round((pass/(pass+fail))*100) : 0;
  }, [findings]);

  const topRisks = [...findings].sort((a,b)=>b.risk_score-a.risk_score).slice(0,3);
  const cspmCount = findings.filter(f=>f.service==="CSPM").length;
  const cwppCount = findings.filter(f=>f.service==="CWPP").length;
  const total = cspmCount + cwppCount;

  return (
    <div>
      {/* Stat row */}
      <div className="row g-3 mb-4">
        <div className="col-2"><RiskGauge score={stats.risk_score}/></div>
        <div className="col-2"><StatCard label="Total"          value={stats.total}    color="text-dark"  icon="cil-list"/></div>
        <div className="col-2"><StatCard label="Critical"       value={stats.critical} color=""           icon="cil-warning"       sub="Act immediately"/></div>
        <div className="col-2"><StatCard label="High"           value={stats.high}     color=""           icon="cil-bell"          sub="Fix within 24h"/></div>
        <div className="col-2"><StatCard label="Medium"         value={stats.medium}   color=""           icon="cil-info"          sub="Fix within 7d"/></div>
        <div className="col-2"><StatCard label="CIS Compliance" value={compPct+"%"}    color="text-ss"    icon="cil-check-circle"  sub="CIS AWS Benchmark"/></div>
      </div>

      {/* Middle row */}
      <div className="row g-3 mb-4">
        <div className="col-8">
          <div className="ss-card h-100">
            <div className="ss-card-hd d-flex align-items-center justify-content-between">
              <span className="fw-semibold" style={{fontSize:".9rem",color:"#374151"}}>
                <i className="cil-fire me-2 text-danger"></i>Top Priority Findings
              </span>
              <span className="text-muted text-xs">Sorted by risk score</span>
            </div>
            <div>
              {topRisks.length === 0 ? (
                <div className="text-center text-muted py-4" style={{fontSize:".85rem"}}>No findings yet — run a scan.</div>
              ) : topRisks.map((f, i) => (
                <div key={f.id} className="d-flex align-items-center gap-3 px-4 py-3"
                  style={{borderBottom:i<topRisks.length-1?"1px solid #f3f4f6":"none"}}>
                  <span className="fw-bold" style={{fontSize:"1.2rem",color:"#e5e7eb",width:24,textAlign:"center"}}>{"#"+(i+1)}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div className="fw-semibold truncate" style={{fontSize:".88rem",color:"#1f2937"}}>{f.finding}</div>
                    <div className="text-muted truncate" style={{fontSize:".72rem",marginTop:2}}>{f.resource} · {f.region}</div>
                  </div>
                  <div className="d-flex align-items-center gap-2 flex-shrink-0">
                    <Badge s={f.severity}/>
                    <span className="fw-bold" style={{fontSize:".85rem",color:riskColor(f.risk_score)}}>{f.risk_score}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="col-4">
          <div className="ss-card mb-3 p-3">
            <div className="ss-label mb-3">Service Coverage</div>
            {[["CSPM","cil-cloud",cspmCount],["CWPP","cil-layers",cwppCount]].map(([s,ic,n])=>(
              <div key={s} className="d-flex align-items-center justify-content-between py-2">
                <div className="d-flex align-items-center gap-2 text-muted" style={{fontSize:".83rem"}}>
                  <i className={ic}></i>{s}
                </div>
                <div className="d-flex align-items-center gap-2">
                  <div className="ss-bar-track" style={{width:80}}>
                    <div className="ss-bar-fill" style={{width:(total>0?(n/total)*100:0)+"%"}}></div>
                  </div>
                  <span className="fw-bold" style={{fontSize:".8rem",color:"#374151",width:14,textAlign:"right"}}>{n}</span>
                </div>
              </div>
            ))}
          </div>
          <div className="ss-card p-3">
            <div className="ss-label mb-3">Regions Scanned</div>
            {["us-east-1","eu-west-1","global"].map(r=>(
              <div key={r} className="d-flex align-items-center gap-2 py-1">
                <span style={{width:7,height:7,borderRadius:"50%",background:"#16a34a",display:"inline-block",flexShrink:0}}></span>
                <span className="font-mono text-muted" style={{fontSize:".78rem"}}>{r}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <FindingsTable findings={findings} onTip={onTip} tips={tips} tipLoading={tipLoading} expanded={expanded}/>
    </div>
  );
}

/* ── CSPM ─────────────────────────────────────────────────────────────────── */

function CSPMPage({ findings, lastScanId, onRefresh, onTip, onRegenerate, tips, tipLoading, expanded }) {
  const [refreshing, setRefreshing] = React.useState(false);
  const cspm = findings.filter(f=>f.service==="CSPM");
  const regions = [...new Set(cspm.map(f=>f.region).filter(Boolean))];
  const byType = cspm.reduce((a,f)=>{ a[f.resource_type]=a[f.resource_type]||[]; a[f.resource_type].push(f); return a; },{});
  const totalLoaded = findings.length;

  const handleRefresh = async () => {
    setRefreshing(true);
    await onRefresh();
    setRefreshing(false);
  };

  return (
    <div>
      {/* Scan data provenance — lets the user confirm what's loaded and force a refresh */}
      <div style={{fontSize:".72rem",color:"#9ca3af",marginBottom:12,display:"flex",gap:16,alignItems:"center"}}>
        <span><i className="cil-cloud me-1"></i>Scan #{lastScanId || "—"}</span>
        <span>{totalLoaded} total findings loaded ({cspm.length} CSPM)</span>
        {totalLoaded === 0 && <span style={{color:"#ef4444"}}>⚠ No findings — run a scan first</span>}
        <button onClick={handleRefresh} disabled={refreshing}
          style={{marginLeft:"auto",fontSize:".72rem",padding:"2px 10px",border:"1px solid #e5e7eb",borderRadius:6,background:"#f9fafb",cursor:"pointer",color:"#374151"}}>
          {refreshing ? "Refreshing…" : "↻ Refresh"}
        </button>
      </div>

      <div className="row g-3 mb-4">
        <div className="col-3"><StatCard label="Misconfigurations" value={cspm.length} color="text-dark" icon="cil-cloud"/></div>
        <div className="col-3"><StatCard label="Critical" value={cspm.filter(f=>f.severity==="CRITICAL").length} color="" icon="cil-warning"/></div>
        <div className="col-3"><StatCard label="High" value={cspm.filter(f=>f.severity==="HIGH").length} color="" icon="cil-bell"/></div>
        <div className="col-3"><StatCard label="Regions" value={regions.length||1} color="text-ss" icon="cil-location-pin" sub={regions.slice(0,3).join(", ")||"global"}/></div>
      </div>

      {Object.entries(byType).map(([type, items]) => (
        <div key={type} className="ss-card mb-3">
          <div className="ss-card-hd d-flex align-items-center justify-content-between">
            <span className="fw-semibold" style={{fontSize:".9rem",color:"#374151"}}>
              <i className="cil-cloud me-2 text-ss"></i>{type}
            </span>
            <span className="text-muted text-xs">{items.length} finding{items.length>1?"s":""}</span>
          </div>

          {items.map((f, idx) => (
            <div key={f.id} style={{borderBottom: idx<items.length-1 ? "1px solid #f3f4f6" : "none"}}>
              {/* Finding row */}
              <div className="px-4 py-3 d-flex gap-4 align-items-start">
                <div style={{flex:1, minWidth:0}}>
                  <div className="d-flex align-items-center gap-2 mb-1 flex-wrap">
                    <Badge s={f.severity}/>
                    <span className="fw-semibold" style={{fontSize:".88rem",color:"#1f2937"}}>{f.finding}</span>
                  </div>
                  <div className="text-muted" style={{fontSize:".75rem",marginBottom:4}}>
                    <i className="cil-cloud me-1"></i>{f.resource}
                    {f.region && <span className="ms-2"><i className="cil-location-pin me-1"></i>{f.region}</span>}
                  </div>
                  {f.remediation && (
                    <div className="d-flex align-items-start gap-1 mt-1"
                      style={{fontSize:".78rem",color:"#166534",background:"#f0fdf4",borderRadius:6,padding:"4px 8px",display:"inline-flex"}}>
                      <i className="cil-check-circle mt-1 flex-shrink-0" style={{color:"#16a34a"}}></i>
                      <span>{f.remediation}</span>
                    </div>
                  )}
                </div>
                <div className="d-flex flex-column align-items-end gap-2 flex-shrink-0">
                  <span className="fw-semibold" style={{fontSize:".78rem",color:riskColor(f.risk_score)}}>Risk {f.risk_score}</span>
                  <button

/* ── Compliance ───────────────────────────────────────────────────────────── */

function CompliancePage({ findings }) {
  const [openSec, setOpenSec] = useState("1");
  const [framework, setFramework] = useState("CIS AWS");

  // Compute CIS control statuses from real scan findings
  const cisControls = useMemo(() => {
    const scanned = findings.length > 0;
    const ids = findings.map(f=>(f.id||"").toUpperCase());
    return CIS_CONTROLS_BASE.map(c => {
      let status = "UNKNOWN";
      if (c.check) {
        status = c.check(ids) || (scanned ? "PASS" : "UNKNOWN");
      }
      return { ...c, status };
    });
  }, [findings]);

  const pass = cisControls.filter(c=>c.status==="PASS").length;
  const fail = cisControls.filter(c=>c.status==="FAIL").length;
  const unk  = cisControls.filter(c=>c.status==="UNKNOWN").length;
  const pct  = (pass+fail) > 0 ? Math.round((pass/(pass+fail))*100) : 0;

  const noScan = findings.length === 0;

  return (
    <div>
      {noScan && (
        <div className="mb-4 d-flex align-items-center gap-3 p-3 rounded" style={{background:"#fffbeb",border:"1px solid #fcd34d",fontSize:".83rem",color:"#92400e"}}>
          <i className="cil-info flex-shrink-0"></i>
          No scan data yet — run a scan first. Controls with a checkable rule will auto-populate as PASS or FAIL.
        </div>
      )}
      <div className="row g-3 mb-4">
        <div className="col-3">
          <div className="ss-stat" style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
            <div className="ss-label mb-2">Compliance Score</div>
            <div className="fw-bold text-ss" style={{fontSize:"2.5rem",lineHeight:1}}>{pct}%</div>
            <div className="ss-bar-track mt-2" style={{width:"80%"}}>
              <div className="ss-bar-fill" style={{width:pct+"%"}}></div>
            </div>
            <div className="text-muted mt-2" style={{fontSize:".72rem"}}>CIS AWS Benchmark v1.5</div>
          </div>
        </div>
        <div className="col-3"><StatCard label="Passing"     value={pass} color="text-success" icon="cil-check-circle" sub="Controls passed"/></div>
        <div className="col-3"><StatCard label="Failing"     value={fail} color="text-danger"  icon="cil-warning"      sub="Controls failed"/></div>
        <div className="col-3"><StatCard label="Not Checked" value={unk}  color="text-muted"   icon="cil-info"         sub="Manual review needed"/></div>
      </div>

      <div className="d-flex align-items-center gap-2 mb-4 flex-wrap">
        <span className="text-muted" style={{fontSize:".83rem"}}>Framework:</span>
        {["CIS AWS","NIST 800-53","SOC 2","PCI-DSS","ISO 27001"].map(fw => (
          <button key={fw} onClick={()=>setFramework(fw)}
            className={"btn btn-sm fw-semibold " + (framework===fw ? "btn-primary" : "btn-outline-secondary")}
            style={{borderRadius:6,fontSize:".78rem"}}>
            {fw}
          </button>
        ))}
      </div>

      {framework !== "CIS AWS" && (
        <div className="ss-card p-5 text-center" style={{borderStyle:"dashed",borderColor:"#e5e7eb"}}>
          <div className="d-inline-flex align-items-center justify-content-center rounded-circle mb-3"
            style={{width:56,height:56,background:"#f0f4f8",border:"2px solid #e2e8f0"}}>
            <i className="cil-layers" style={{fontSize:"1.4rem",color:"#64748b"}}></i>
          </div>
          <h6 className="fw-semibold mb-2" style={{color:"#374151"}}>{framework} — Coming Soon</h6>
          <p className="text-muted mb-0" style={{fontSize:".85rem",maxWidth:360,margin:"0 auto"}}>
            {framework} controls are on the roadmap. Switch to <strong>CIS AWS</strong> to see your live findings.
          </p>
        </div>
      )}

      {framework === "CIS AWS" && Object.entries(CIS_SECTIONS).map(([sec, title]) => {
        const controls = cisControls.filter(c=>c.section===sec);
        const sPass = controls.filter(c=>c.status==="PASS").length;
        const sFail = controls.filter(c=>c.status==="FAIL").length;
        return (
          <div key={sec} className="ss-card mb-2">
            <button onClick={()=>setOpenSec(openSec===sec ? null : sec)}
              className="w-100 d-flex align-items-center justify-content-between p-3 bg-transparent border-0 text-start"
              style={{borderRadius:12,cursor:"pointer"}}>
              <div className="d-flex align-items-center gap-3">
                <span className="font-mono text-muted fw-bold" style={{fontSize:".75rem",width:20}}>{sec}</span>
                <span className="fw-semibold" style={{fontSize:".88rem",color:"#374151"}}>{title}</span>
                {sFail > 0 && (
                  <span className="badge" style={{background:"#fee2e2",color:"#dc2626",fontWeight:600,fontSize:".68rem"}}>
                    {sFail} failing
                  </span>
                )}
              </div>
              <div className="d-flex align-items-center gap-3">
                <span className="text-muted" style={{fontSize:".78rem"}}>{sPass}/{sPass+sFail} passed</span>
                <i className={"cil-chevron-" + (openSec===sec ? "top" : "bottom") + " text-muted"}></i>
              </div>
            </button>
            {openSec===sec && (
              <div style={{borderTop:"1px solid #f1f1f1"}}>
                {controls.map(c => (
                  <div key={c.id} className="d-flex align-items-center gap-3 px-4 py-2"
                    style={{borderBottom:"1px solid #f9fafb"}}>
                    <span className="font-mono text-muted fw-semibold" style={{fontSize:".72rem",width:44,flexShrink:0}}>{c.id}</span>
                    <span style={{flex:1,fontSize:".85rem",color:"#374151"}}>{c.title}</span>
                    <span className="ss-badge flex-shrink-0" style={{
                      background: c.status==="PASS"?"#d1fae5":c.status==="FAIL"?"#fee2e2":"#f3f4f6",
                      color: c.status==="PASS"?"#065f46":c.status==="FAIL"?"#dc2626":"#9ca3af",
                    }}>
                      {c.status==="UNKNOWN" ? "N/A" : c.status}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ── Reports ──────────────────────────────────────────────────────────────── */

function ReportsPage({ findings, stats }) {
  const [pdfLoading, setPdfLoading] = useState(false);

  const downloadCSV = () => {
    const headers = ["ID","Resource","Resource Type","Region","Finding","Severity","Service","Risk Score","CIS Control","Remediation"];
    const rows = findings.map(f => [
      f.id, '"'+f.resource+'"', f.resource_type, f.region,
      '"'+f.finding+'"', f.severity, f.service, f.risk_score,
      f.cis_control, '"'+f.remediation+'"'
    ]);
    const csv = [headers].concat(rows).map(r=>r.join(",")).join("\n");
    const url = URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    const a = document.createElement("a"); a.href=url; a.download="shieldscan-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 100);
  };

  const downloadJSON = () => {
    const report = {
      generated_at: new Date().toISOString(),
      risk_score: stats.risk_score,
      summary: { total:stats.total, critical:stats.critical, high:stats.high, medium:stats.medium },
      findings,
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:"application/json"}));
    const a = document.createElement("a"); a.href=url; a.download="shieldscan-"+new Date().toISOString().slice(0,10)+".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 100);
  };

  const openPDF = async () => {
    setPdfLoading(true);
    try {
      const res = await apiFetch("/api/scan/report");
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || "Failed to generate report. Run a scan first.");
        return;
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "shieldscan-audit-" + new Date().toISOString().slice(0,10) + ".pdf";
      a.click();
      URL.revokeObjectURL(url);
    } catch(e) {
      alert("Report generation failed: " + e.message);
    } finally {
      setPdfLoading(false);
    }
  };

  const exportCards = [
    { icon:"cil-spreadsheet", title:"CSV Export",       desc:"All findings as a spreadsheet — import into Excel, Google Sheets, or your SIEM.", action:downloadCSV, label:"Download CSV",   loading:false },
    { icon:"cil-code",        title:"JSON Export",       desc:"Machine-readable findings dump for API integrations or custom tooling.",           action:downloadJSON, label:"Download JSON", loading:false },
    { icon:"cil-description", title:"PDF Audit Report",  desc:"Formatted audit report with executive summary, risk score, and full findings with remediation steps.",  action:openPDF, label:pdfLoading?"Generating…":"Download PDF", loading:pdfLoading },
  ];

  return (
    <div>
      <div className="row g-3 mb-4">
        <div className="col-4"><StatCard label="Total Findings" value={stats.total}             color="text-dark"  icon="cil-list"/></div>
        <div className="col-4"><StatCard label="Critical"       value={stats.critical}           color="text-danger" icon="cil-warning"/></div>
        <div className="col-4"><StatCard label="Overall Risk"   value={stats.risk_score+"/100"}  color="text-ss"   icon="cil-speedometer"/></div>
      </div>

      <div className="row g-3 mb-4">
        {exportCards.map(c => (
          <div key={c.title} className="col-4">
            <div className="ss-card p-4 d-flex flex-column gap-3 h-100"
              style={{cursor:"pointer",transition:"border .15s"}}
              onClick={c.action}
              onMouseEnter={e=>e.currentTarget.style.borderColor="var(--ss)"}
              onMouseLeave={e=>e.currentTarget.style.borderColor="#e9ecef"}>
              <i className={c.icon + " text-muted"} style={{fontSize:"1.8rem"}}></i>
              <div style={{flex:1}}>
                <div className="fw-semibold mb-1" style={{color:"#1f2937"}}>{c.title}</div>
                <div className="text-muted" style={{fontSize:".82rem",lineHeight:1.5}}>{c.desc}</div>
              </div>
              <button disabled={c.loading} className="btn btn-primary w-100 fw-semibold" style={{borderRadius:8}}>
                {c.loading && <span className="me-2"><Spinner/></span>}
                {c.label}
              </button>
            </div>
          </div>
        ))}
      </div>

      <div className="ss-card">
        <div className="ss-card-hd d-flex align-items-center justify-content-between">
          <span className="fw-semibold" style={{fontSize:".9rem",color:"#374151"}}>
            <i className="cil-description me-2 text-ss"></i>Report Preview
          </span>
          <span className="text-muted text-xs">{new Date().toLocaleDateString()}</span>
        </div>
        <div className="p-4">
          <div className="p-3 font-mono" style={{background:"#f9fafb",border:"1px solid #e9ecef",borderRadius:8,fontSize:".75rem",lineHeight:1.8,color:"#374151",whiteSpace:"pre-wrap"}}>
            <div className="fw-bold mb-1" style={{fontSize:".85rem",color:"#1f2937"}}>ShieldScan Security Audit Report</div>
            <div className="text-muted">{new Date().toLocaleDateString()} · Regions: us-east-1, eu-west-1, global</div>
            <div className="my-1" style={{color:"#d1d5db"}}>──────────────────────────────────────</div>
            <div>EXECUTIVE SUMMARY</div>
            <div>Overall Risk Score  : {stats.risk_score}/100</div>
            <div>Total Findings      : {stats.total}</div>
            <div>Critical            : {stats.critical}  (immediate action required)</div>
            <div>High                : {stats.high}  (fix within 24 hours)</div>
            <div>Medium              : {stats.medium}  (fix within 7 days)</div>
            <div className="my-1" style={{color:"#d1d5db"}}>──────────────────────────────────────</div>
            {findings.length > 0 ? (
              findings.slice(0, 10).map((f, i) => (
                <div key={f.id || i}>
                  #{String(i+1).padEnd(2)}  {String(f.id||"").padEnd(6)}  {String(f.severity||"UNKNOWN").padEnd(8)}  Risk:{String(f.risk_score||0).padEnd(3)}  {f.finding}
                </div>
              ))
            ) : (
              <div className="text-muted fst-italic">No findings available.</div>
            )}
            {findings.length > 10 && (
              <div className="text-muted mt-2">… {findings.length - 10} more findings — export to PDF for full detail</div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

          <div className="d-flex gap-2 mb-3 align-items-center">
            <div className="d-flex align-items-center justify-content-center rounded-circle"
              style={{width:28,height:28,background:"var(--ss)",flexShrink:0}}>
              <i className="cil-shield-alt text-white" style={{fontSize:".85rem"}}></i>
            </div>
            <div className="ss-bubble-ai d-flex align-items-center gap-2">
              <Spinner dark/><span className="text-muted" style={{fontSize:".83rem"}}>Thinking…</span>
            </div>
          </div>
        )}
        <div ref={bottomRef}/>
      </div>

      <div className="p-3 d-flex gap-2 flex-shrink-0" style={{borderTop:"1px solid #f1f1f1"}}>
        <input value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey) send();}}
          placeholder="Ask about your findings…"
          className="form-control" style={{borderRadius:8,fontSize:".85rem"}}/>
        <button onClick={()=>send()} disabled={loading||!input.trim()}
          className="btn btn-primary fw-semibold d-flex align-items-center gap-2" style={{borderRadius:8,padding:"8px 16px"}}>
          <i className="cil-send"></i>
        </button>
      </div>
    </div>
  );
}

function TwoFactorSection() {
  // ── TOTP section ──
  const [totpStatus, setTotpStatus] = useState("idle"); // idle | setup | confirming | enabled
  const [totpData, setTotpData] = useState(null);  // { qr_code, secret, backup_codes }
  const [totpCode, setTotpCode] = useState("");
  const [disablePwd, setDisablePwd] = useState("");
  const [disableCode, setDisableCode] = useState("");
  const [totpMsg, setTotpMsg] = useState(null);  // { type: "success"|"error", text }
  const [totpLoading, setTotpLoading] = useState(false);
  const [totpEnabled, setTotpEnabled] = useState(false);

  // ── Passkey section ──
  const [passkeys, setPasskeys] = useState([]);
  const [pkLoading, setPkLoading] = useState(false);
  const [pkMsg, setPkMsg] = useState(null);
  const [pkNewName, setPkNewName] = useState("My Passkey");

  // Load initial state — TOTP status + passkey list
  useEffect(() => {
    apiFetch("/api/auth/me").then(r=>r.json()).then(d=>{
      if (d && typeof d.totp_enabled === "boolean") {
        setTotpEnabled(d.totp_enabled);
        if (d.totp_enabled) setTotpStatus("enabled");
      }
    }).catch(()=>{});
    apiFetch("/api/passkey/list").then(r=>r.json()).then(d=>{
      if (d.passkeys) setPasskeys(d.passkeys);
    }).catch(()=>{});
  }, []);

  // ── TOTP handlers ──
  const startTotpSetup = async () => {
    setTotpLoading(true); setTotpMsg(null);
    try {
      const res = await apiFetch("/api/auth/totp/setup", { method:"POST" });
      const d = await res.json();
      if (!res.ok) { setTotpMsg({ type:"error", text: d.detail || "Setup failed" }); setTotpLoading(false); return; }
      setTotpData(d);
      setTotpStatus("setup");
    } catch { setTotpMsg({ type:"error", text:"Backend unreachable." }); }
    setTotpLoading(false);
  };

  const confirmTotp = async () => {
    if (totpCode.length !== 6) return;
    setTotpLoading(true); setTotpMsg(null);
    try {
      const res = await apiFetch("/api/auth/totp/enable", { method:"POST", body: JSON.stringify({ code: totpCode }) });
      const d = await res.json();
      if (!res.ok) { setTotpMsg({ type:"error", text: d.detail || "Invalid code." }); setTotpLoading(false); return; }
      setTotpEnabled(true); setTotpStatus("enabled");
      setTotpMsg({ type:"success", text:"Two-factor authentication is now active." });
      setTotpCode("");
    } catch { setTotpMsg({ type:"error", text:"Backend unreachable." }); }
    setTotpLoading(false);
  };

  const disableTotp = async () => {
    if (!disablePwd || !disableCode) { setTotpMsg({ type:"error", text:"Enter password and current TOTP code." }); return; }
    setTotpLoading(true); setTotpMsg(null);
    try {
      const res = await apiFetch("/api/auth/totp/disable", { method:"POST", body: JSON.stringify({ password: disablePwd, code: disableCode }) });
      const d = await res.json();
      if (!res.ok) { setTotpMsg({ type:"error", text: d.detail || "Failed." }); setTotpLoading(false); return; }
      setTotpEnabled(false); setTotpStatus("idle"); setTotpData(null);
      setDisablePwd(""); setDisableCode("");
      setTotpMsg({ type:"success", text:"Two-factor authentication disabled." });
    } catch { setTotpMsg({ type:"error", text:"Backend unreachable." }); }
    setTotpLoading(false);
  };

  // ── Passkey handlers ──
  const registerPasskey = async () => {
    setPkLoading(true); setPkMsg(null);
    try {
      // Begin
      const beginRes = await apiFetch("/api/passkey/register/begin", { method:"POST" });
      if (!beginRes.ok) {
        const d = await beginRes.json();
        setPkMsg({ type:"error", text: d.detail || "Could not start passkey registration." });
        setPkLoading(false); return;
      }
      const options = await beginRes.json();

      // Prepare PublicKeyCredentialCreationOptions
      const publicKey = {
        ...options,
        challenge: base64urlToBuffer(options.challenge),
        user: {
          ...options.user,
          id: base64urlToBuffer(options.user.id),
        },
        excludeCredentials: (options.excludeCredentials || []).map(c => ({
          ...c, id: base64urlToBuffer(c.id),
        })),
      };

      let credential;
      try {
        credential = await navigator.credentials.create({ publicKey });
      } catch (ex) {
        setPkMsg({ type:"error", text:"Passkey creation cancelled: " + (ex.message || "") });
        setPkLoading(false); return;
      }

      // Complete
      const completeRes = await apiFetch("/api/passkey/register/complete", {
        method:"POST",
        body: JSON.stringify({
          name: pkNewName || "My Passkey",
          response: {
            id: credential.id,
            rawId: bufferToBase64url(credential.rawId),
            response: {
              clientDataJSON: bufferToBase64url(credential.response.clientDataJSON),
              attestationObject: bufferToBase64url(credential.response.attestationObject),
            },
            type: credential.type,
          },
        }),
      });
      const result = await completeRes.json();
      if (!completeRes.ok) { setPkMsg({ type:"error", text: result.detail || "Registration failed." }); setPkLoading(false); return; }

      // Refresh list
      const listRes = await apiFetch("/api/passkey/list");
      const listData = await listRes.json();
      if (listData.passkeys) setPasskeys(listData.passkeys);
      setPkMsg({ type:"success", text:"Passkey registered! You can now sign in with your fingerprint or Face ID." });
      setPkNewName("My Passkey");
    } catch (ex) {
      setPkMsg({ type:"error", text:"Error: " + (ex.message || "Unknown") });
    }
    setPkLoading(false);
  };

  const removePasskey = async (id) => {
    if (!window.confirm("Remove this passkey?")) return;
    setPkLoading(true); setPkMsg(null);
    try {
      const res = await apiFetch(`/api/passkey/remove/${id}`, { method:"DELETE" });
      const d = await res.json();
      if (!res.ok) { setPkMsg({ type:"error", text: d.detail }); setPkLoading(false); return; }
      setPasskeys(p => p.filter(pk => pk.id !== id));
      setPkMsg({ type:"success", text:"Passkey removed." });
    } catch { setPkMsg({ type:"error", text:"Backend unreachable." }); }
    setPkLoading(false);
  };

  const SecMsg = ({ m }) => m ? (
    <div className={"alert py-2 px-3 mt-3 d-flex align-items-center gap-2"} style={{
      fontSize:".82rem", borderRadius:8,
      background: m.type==="success" ? "#d1fae5" : "#fee2e2",
      border: `1px solid ${m.type==="success" ? "#a7f3d0" : "#fca5a5"}`,
      color: m.type==="success" ? "#065f46" : "#991b1b",
    }}>
      <i className={m.type==="success" ? "cil-check-circle" : "cil-warning"}></i>
      {m.text}
    </div>
  ) : null;

  return (
    <div className="row g-4">
      {/* ── TOTP Card ── */}
      <div className="col-12 col-lg-6">
        <div className="ss-card p-4 h-100">
          <div className="d-flex align-items-center gap-3 mb-4">
            <div className="d-flex align-items-center justify-content-center rounded-circle"
              style={{width:44,height:44,background:totpEnabled?"#d1fae5":"#eff6ff",flexShrink:0}}>
              <i className="cil-lock-locked" style={{fontSize:"1.2rem",color:totpEnabled?"#065f46":"#2563eb"}}></i>
            </div>
            <div>
              <div className="fw-semibold" style={{color:"#1f2937"}}>Authenticator App (2FA)</div>
              <div className="text-muted" style={{fontSize:".78rem"}}>
                {totpEnabled
                  ? <span className="text-success fw-semibold"><i className="cil-check me-1"></i>Enabled</span>
                  : "Generate 6-digit codes with any TOTP app"}
              </div>
            </div>
          </div>

          {totpMsg && <SecMsg m={totpMsg}/>}

          {/* Idle — not set up */}
          {totpStatus === "idle" && !totpEnabled && (
            <div>
              <p className="text-muted mb-3" style={{fontSize:".82rem"}}>
                Compatible with <strong>Google Authenticator</strong>, <strong>Authy</strong>, <strong>1Password</strong>, and any TOTP app.
              </p>
              <button onClick={startTotpSetup} disabled={totpLoading}
                className="btn btn-primary fw-semibold d-flex align-items-center gap-2"
                style={{borderRadius:8,padding:"9px 20px"}}>
                {totpLoading ? <><Spinner/> Setting up…</> : <><i className="cil-qr-code"></i> Set up 2FA</>}
              </button>
            </div>
          )}

          {/* Setup — show QR code */}
          {totpStatus === "setup" && totpData && (
            <div>
              <p className="text-muted mb-3" style={{fontSize:".82rem"}}>
                Scan this QR code with your authenticator app, then enter the 6-digit code to confirm.
              </p>
              <div className="text-center mb-3">
                <img src={totpData.qr_code} alt="TOTP QR Code"
                  style={{width:160,height:160,borderRadius:12,border:"3px solid #e5e7eb"}}/>
              </div>
              <div className="mb-3">
                <label className="form-label fw-semibold text-uppercase" style={{fontSize:".65rem",color:"#6b7280",letterSpacing:".05em"}}>
                  Manual entry code
                </label>
                <div className="p-2 font-mono text-center fw-bold"
                  style={{background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,fontSize:".85rem",letterSpacing:".15em",color:"#374151"}}>
                  {totpData.secret}
                </div>
              </div>
              {totpData.backup_codes && (
                <div className="mb-3 p-3"
                  style={{background:"#fffbeb",border:"1px solid #fde68a",borderRadius:8}}>
                  <div className="fw-semibold mb-2" style={{fontSize:".78rem",color:"#92400e"}}>
                    <i className="cil-warning me-1"></i>Save these backup codes — shown only once
                  </div>
                  <div className="d-flex flex-wrap gap-1">
                    {totpData.backup_codes.map((c,i)=>(
                      <span key={i} className="font-mono" style={{fontSize:".75rem",background:"#fff",border:"1px solid #fde68a",borderRadius:4,padding:"2px 7px"}}>{c}</span>
                    ))}
                  </div>
                </div>
              )}
              <div className="mb-3">
                <label className="form-label fw-semibold text-uppercase" style={{fontSize:".65rem",color:"#6b7280",letterSpacing:".05em"}}>
                  Verify — enter the code from your app
                </label>
                <input type="text" className="form-control text-center font-mono fw-bold"
                  value={totpCode} onChange={e=>setTotpCode(e.target.value.replace(/\D/g,"").slice(0,6))}
                  placeholder="000000" maxLength={6}
                  style={{borderRadius:8,fontSize:"1.2rem",letterSpacing:".3em"}}/>
              </div>
              <button onClick={confirmTotp} disabled={totpLoading || totpCode.length < 6}
                className="btn btn-primary w-100 fw-semibold d-flex align-items-center justify-content-center gap-2"
                style={{borderRadius:8,padding:"9px"}}>
                {totpLoading ? <><Spinner/> Verifying…</> : "Activate 2FA"}
              </button>
            </div>
          )}

          {/* Enabled — show disable form */}
          {(totpEnabled || totpStatus === "enabled") && (
            <div>
              <p className="text-muted mb-3" style={{fontSize:".82rem"}}>
                To disable 2FA, enter your password and a valid authenticator code.
              </p>
              <div className="mb-2">
                <input type="password" className="form-control" value={disablePwd}
                  onChange={e=>setDisablePwd(e.target.value)} placeholder="Current password"
                  style={{borderRadius:8,marginBottom:8}}/>
                <input type="text" className="form-control font-mono text-center"
                  value={disableCode} onChange={e=>setDisableCode(e.target.value.replace(/\D/g,"").slice(0,6))}
                  placeholder="6-digit code" maxLength={6} style={{borderRadius:8,letterSpacing:".2em"}}/>
              </div>
              <button onClick={disableTotp} disabled={totpLoading}
                className="btn btn-outline-danger fw-semibold d-flex align-items-center gap-2"
                style={{borderRadius:8,padding:"8px 18px"}}>
                {totpLoading ? <><Spinner/> Disabling…</> : <><i className="cil-x"></i> Disable 2FA</>}
              </button>
            </div>
          )}
        </div>
      </div>

      {/* ── Passkey Card ── */}
      <div className="col-12 col-lg-6">
        <div className="ss-card p-4 h-100">
          <div className="d-flex align-items-center gap-3 mb-4">
            <div className="d-flex align-items-center justify-content-center rounded-circle"
              style={{width:44,height:44,background:"#f0fdf4",flexShrink:0}}>
              <i className="cil-fingerprint" style={{fontSize:"1.2rem",color:"#16a34a"}}></i>
            </div>
            <div>
              <div className="fw-semibold" style={{color:"#1f2937"}}>
                Passkeys
                <span className="ms-2 badge" style={{background:"#eff6ff",color:"#2563eb",fontSize:".6rem",fontWeight:700}}>FIDO2</span>
              </div>
              <div className="text-muted" style={{fontSize:".78rem"}}>Touch ID · Face ID · Windows Hello</div>
            </div>
          </div>

          {pkMsg && <SecMsg m={pkMsg}/>}

          {/* Registered passkeys list */}
          {passkeys.length > 0 && (
            <div className="mb-4">
              {passkeys.map(pk => (
                <div key={pk.id} className="d-flex align-items-center justify-content-between py-2"
                  style={{borderBottom:"1px solid #f3f4f6"}}>
                  <div className="d-flex align-items-center gap-2">
                    <i className="cil-fingerprint text-success" style={{fontSize:".95rem"}}></i>
                    <div>
                      <div className="fw-semibold" style={{fontSize:".85rem",color:"#374151"}}>{pk.name}</div>
                      <div className="text-muted" style={{fontSize:".72rem"}}>
                        Added {pk.created_at ? new Date(pk.created_at).toLocaleDateString() : "—"}
                      </div>
                    </div>
                  </div>
                  <button onClick={()=>removePasskey(pk.id)} disabled={pkLoading}
                    className="btn btn-sm btn-outline-danger" style={{borderRadius:6,padding:"3px 10px",fontSize:".75rem"}}>
                    Remove
                  </button>
                </div>
              ))}
            </div>
          )}

          {passkeys.length === 0 && (
            <p className="text-muted mb-4" style={{fontSize:".82rem"}}>
              No passkeys registered yet. Add one to sign in with your fingerprint, Face ID, or Windows Hello — no password required.
            </p>
          )}

          {/* Add new passkey */}
          <div className="mb-3">
            <label className="form-label fw-semibold text-uppercase" style={{fontSize:".65rem",color:"#6b7280",letterSpacing:".05em"}}>
              Passkey name (optional)
            </label>
            <input type="text" className="form-control" value={pkNewName}
              onChange={e=>setPkNewName(e.target.value)} placeholder="MacBook Touch ID"
              style={{borderRadius:8}}/>
          </div>
          <button onClick={registerPasskey} disabled={pkLoading}
            className="btn btn-success fw-semibold d-flex align-items-center gap-2"
            style={{borderRadius:8,padding:"9px 20px"}}>
            {pkLoading ? <><Spinner/> Waiting for biometric…</> : <><i className="cil-fingerprint"></i> Add Passkey</>}
          </button>
          <p className="text-muted mt-2 mb-0" style={{fontSize:".75rem"}}>
            Your browser will ask to confirm with Touch ID, Face ID, or PIN.
          </p>
        </div>
      </div>
    </div>
  );
}

function IDCardSection() {
  const [keyStatus, setKeyStatus] = useState({ has_keypair: false, fingerprint: null });
  const [keyLoading, setKeyLoading] = useState(false);
  const [keyErr, setKeyErr] = useState("");
  const [keyMsg, setKeyMsg] = useState("");

  // Save-As modal state
  const [pendingBlob, setPendingBlob] = useState(null);
  const [saveModalOpen, setSaveModalOpen] = useState(false);
  const [customFilename, setCustomFilename] = useState("shieldscan-private");

  const buildDefaultFilename = () => {
    try {
      const raw = localStorage.getItem("ss_session");
      const session = raw ? JSON.parse(raw) : {};
      const name = session.user?.name || "";
      const uid  = session.user?.id  || "";
      const slug = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "user";
      return uid ? `${slug}_${uid}` : slug;
    } catch {
      return "user_key";
    }
  };

  const [verifyLoading, setVerifyLoading] = useState(false);
  const [verifyErr, setVerifyErr] = useState("");
  const [verifyMsg, setVerifyMsg] = useState("");
  
  const fileInputRef = useRef(null);

  const loadStatus = useCallback(async () => {
    try {
      const res = await apiFetch("/api/auth/keypair/status");
      if (res.ok) {
        const d = await res.json();
        setKeyStatus(d);
      }
    } catch (e) {
      console.error("Failed to load key status", e);
    }
  }, []);

  useEffect(() => {
    loadStatus();
  }, [loadStatus]);

  const generateKeypair = async () => {
    setKeyLoading(true); setKeyErr(""); setKeyMsg("");
    try {
      const res = await apiFetch("/api/auth/keypair/generate", { method: "POST" });
      if (!res.ok) {
        const d = await res.json();
        setKeyErr(d.detail || "Failed to generate key pair.");
        setKeyLoading(false); return;
      }
      const blob = await res.blob();

      const defaultName = buildDefaultFilename();
      if (window.showSaveFilePicker) {
        // Chrome/Edge: native OS Save As dialog
        try {
          const fileHandle = await window.showSaveFilePicker({
            suggestedName: defaultName + ".pem",
            types: [{ description: "PEM Private Key", accept: { "application/x-pem-file": [".pem"] } }],
          });
          const writable = await fileHandle.createWritable();
          await writable.write(blob);
          await writable.close();
          setKeyMsg("Key pair saved successfully.");
          loadStatus();
        } catch (err) {
          if (err.name !== "AbortError") setKeyErr("Failed to save file: " + err.message);
        }
        setKeyLoading(false);
      } else {
        // Safari/Firefox: show in-app modal to choose filename, then download
        setPendingBlob(blob);
        setCustomFilename(defaultName);
        setSaveModalOpen(true);
        setKeyLoading(false);
      }
    } catch {
      setKeyErr("Cannot reach backend.");
      setKeyLoading(false);
    }
  };

  const confirmSaveKey = () => {
    if (!pendingBlob) return;
    const name = (customFilename.trim() || "shieldscan-private").replace(/\.pem$/i, "");
    const url = URL.createObjectURL(pendingBlob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name + ".pem";
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 100);
    setPendingBlob(null);
    setSaveModalOpen(false);
    setKeyMsg(`Key pair downloaded as "${name}.pem". Store it somewhere safe — you cannot recover it later.`);
    loadStatus();
  };

  const handleVerifyKey = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setVerifyLoading(true); setVerifyErr(""); setVerifyMsg("");
    const formData = new FormData();
    formData.append("file", file);
    try {
      const res = await fetch(API + "/api/auth/keypair/verify", {
        method: "POST",
        headers: authToken ? { "Authorization": "Bearer " + authToken } : {},
        body: formData
      });
      const d = await res.json();
      if (!res.ok) {
        setVerifyErr(d.detail || "Verification failed.");
      } else {
        setVerifyMsg(d.message || "Key pair verified successfully!");
      }
    } catch {
      setVerifyErr("Cannot reach backend.");
    }
    setVerifyLoading(false);
    if (fileInputRef.current) fileInputRef.current.value = "";
  };

  return (
    <div style={{maxWidth: 640}}>

      {/* Save-As modal for Safari/Firefox */}
      {saveModalOpen && (
        <div style={{
          position:"fixed", inset:0, background:"rgba(0,0,0,0.5)",
          zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center"
        }}>
          <div className="ss-card p-4" style={{width:380, borderRadius:14}}>
            <h6 className="fw-semibold mb-3" style={{color:"#1f2937"}}>
              <i className="cil-cloud-download me-2 text-ss"></i>Save Private Key
            </h6>
            <p className="text-muted mb-3" style={{fontSize:".85rem"}}>
              Choose a filename for your private key. It will be saved to your default Downloads folder.
            </p>
            <div className="input-group mb-3">
              <input
                type="text"
                className="form-control"

function DeleteAccountSection({ onSignOut }) {
  const [step, setStep]           = useState(0); // 0=idle 1=confirm-modal 2=password-modal
  const [password, setPassword]   = useState("");
  const [loading, setLoading]     = useState(false);
  const [err, setErr]             = useState("");

  const openConfirm  = () => { setStep(1); setErr(""); setPassword(""); };
  const openPassword = () => setStep(2);
  const close        = () => { setStep(0); setErr(""); setPassword(""); };

  const confirmDelete = async () => {
    if (!password.trim()) { setErr("Please enter your password to confirm."); return; }
    setLoading(true); setErr("");
    try {
      const res = await apiFetch("/api/auth/account", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!res.ok) {
        const d = await res.json();
        setErr(d.detail || "Failed to delete account.");
        setLoading(false); return;
      }
      // Sign the user out — their session is now invalid
      close();
      if (onSignOut) onSignOut();
    } catch {
      setErr("Cannot reach backend. Try again.");
    }
    setLoading(false);
  };

  const modalBase = {
    position:"fixed", inset:0, background:"rgba(0,0,0,0.55)",
    zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center",
  };

  return (
    <div className="ss-card p-4 mt-3" style={{border:"1.5px solid #fee2e2", borderRadius:14}}>
      <h6 className="fw-semibold mb-1" style={{color:"#dc2626"}}>
        <i className="cil-trash me-2"></i>Delete Account
      </h6>
      <p className="text-muted mb-3" style={{fontSize:".85rem"}}>
        Permanently remove your ShieldScan account and all associated data.
        This action starts a 30-day grace period before final deletion.
      </p>
      <button
        className="btn btn-sm fw-semibold"
        style={{background:"#fee2e2", color:"#dc2626", border:"1px solid #fca5a5", borderRadius:8}}
        onClick={openConfirm}
      >
        <i className="cil-trash me-2"></i>Delete My Account
      </button>

      {/* Step 1 — Warning + 30-day notice */}
      {step === 1 && (
        <div style={modalBase}>
          <div className="ss-card p-4" style={{width:420, borderRadius:14}}>
            <div className="d-flex align-items-center mb-3 gap-2">
              <i className="cil-warning" style={{fontSize:"1.5rem", color:"#dc2626"}}></i>
              <h6 className="fw-bold mb-0" style={{color:"#dc2626"}}>Before you delete your account</h6>
            </div>

            <div className="p-3 mb-3" style={{background:"#fffbeb", border:"1px solid #fde68a", borderRadius:10}}>
              <p className="mb-2 fw-semibold" style={{fontSize:".88rem", color:"#92400e"}}>
                <i className="cil-clock me-2"></i>30-Day Recovery Window
              </p>
              <p className="mb-0" style={{fontSize:".84rem", color:"#78350f"}}>
                Your account will be <strong>deactivated immediately</strong> but your data stays
                in our database for <strong>30 days</strong>. During this period you cannot log in,
                but you can contact support to recover everything. After 30 days, all data is
                permanently and irreversibly deleted.
              </p>
            </div>

            <ul className="mb-3" style={{fontSize:".84rem", color:"#4b5563", paddingLeft:"1.2rem"}}>
              <li>All scan findings and history will be deleted</li>
              <li>Your AWS credentials will be wiped</li>
              <li>Your RSA key pair registration will be removed</li>
              <li>You will be signed out immediately</li>
            </ul>

            <div className="d-flex gap-2 justify-content-end">
              <button className="btn btn-outline-secondary btn-sm" style={{borderRadius:8}} onClick={close}>
                Cancel
              </button>
              <button
                className="btn btn-sm fw-semibold"
                style={{background:"#dc2626", color:"#fff", borderRadius:8, border:"none"}}
                onClick={openPassword}
              >
                I understand — Continue
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Step 2 — Password confirmation */}
      {step === 2 && (
        <div style={modalBase}>
          <div className="ss-card p-4" style={{width:400, borderRadius:14}}>
            <h6 className="fw-bold mb-1" style={{color:"#dc2626"}}>
              <i className="cil-lock-locked me-2"></i>Confirm your password
            </h6>
            <p className="text-muted mb-3" style={{fontSize:".84rem"}}>
              Enter your current password to permanently schedule your account for deletion.
            </p>
            <input
              type="password"
              className="form-control mb-2"
              placeholder="Your password"

              onChange={e => setPassword(e.target.value)}
              onKeyDown={e => e.key === "Enter" && confirmDelete()}

            />
            {err && (
              <div className="alert alert-danger py-2 px-3 mb-2" style={{fontSize:".82rem", borderRadius:8}}>
                <i className="cil-warning me-2"></i>{err}
              </div>
            )}
            <div className="d-flex gap-2 justify-content-end mt-1">
              <button className="btn btn-outline-secondary btn-sm" style={{borderRadius:8}} onClick={close} disabled={loading}>
                Cancel
              </button>
              <button
                className="btn btn-sm fw-semibold"
                style={{background:"#dc2626", color:"#fff", borderRadius:8, border:"none"}}
                onClick={confirmDelete}

      )}

  );

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null, info: null };
  }
  static getDerivedStateFromError(error) { return { hasError: true, error }; }
  componentDidCatch(error, info) { this.setState({ error, info }); }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{padding:20, background:"#fee2e2", border:"2px solid #ef4444", color:"#991b1b", borderRadius:8, maxWidth:560}}>
          <h5 className="fw-bold mb-3"><i className="cil-warning me-2"></i>Component Crash Detected</h5>
          <div className="font-mono text-xs p-3 bg-white rounded" style={{border:"1px solid #fca5a5", overflowX:"auto"}}>
            <strong>Error:</strong> {this.state.error && this.state.error.toString()}<br/><br/>
            <strong>Component Stack:</strong><br/>{this.state.info && this.state.info.componentStack}
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function MainApp({ user, onSignOut, initialView, initialSettingsTab }) {
  const [view, setView] = useState(initialView || "dashboard");
  const [settingsTab, setSettingsTab] = useState(initialSettingsTab || "profile");
  const [findings, setFindings] = useState([]);
  const [stats, setStats] = useState({ total:0, critical:0, high:0, medium:0, low:0, risk_score:0 });
  const [backendErr, setBackendErr] = useState(false);
  const [ready, setReady] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [lastScan, setLastScan] = useState(null);
  const [expanded, setExpanded] = useState(null);
  const [tips, setTips] = useState({});
  const [tipLoading, setTipLoading] = useState({});
  const [awsConnected, setAwsConnected] = useState(false);
  const [showProgress, setShowProgress] = useState(false);
  const [scanKey, setScanKey] = useState(0);  // increments after each scan to force re-mounts
  const [lastScanId, setLastScanId] = useState(null); // tracks which scan's data we're showing

  // Fetch AWS connection status from profile
  useEffect(() => {
    if (!authToken) return;
    apiFetch("/api/auth/me").then(r => r.ok ? r.json() : null).then(d => {
      if (d) setAwsConnected(!!d.aws_connected);
    }).catch(() => {});
  }, []);

  const load = useCallback(async () => {
    if (!authToken) { setReady(true); return; }
    const sevRisk = { CRITICAL:95, HIGH:75, MEDIUM:45, LOW:20 };
    try {
      const r = await apiFetch("/api/scan/findings");
      // Token expired → sign out cleanly instead of showing a broken state
      if (r.status === 401) { onSignOut(); return; }
      const d = await r.json();
      const raw = d.findings || [];
      const mapped = raw.map(f => ({
        id: f.finding_id || ("F" + String(f.id).padStart(3,"0")),
        resource: f.resource || "Unknown",
        resource_type: f.finding_type === "CSPM" ? "AWS Resource" : "Container",
        region: f.region || "global",
        finding: f.title || "Security finding",
        severity: f.severity,
        service: f.finding_type,
        risk_score: sevRisk[f.severity] || 10,
        cis_control: f.cve_id ? "CVE: "+f.cve_id : (f.finding_id || ""),
        remediation: f.fix_recommendation || "",
        description: f.description || "",
        _rawId: f.id,
      }));
      const counts = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0 };
      mapped.forEach(f => { if (counts[f.severity]!==undefined) counts[f.severity]++; });
      setFindings(mapped);
      setLastScanId(d.scan_id || null);  // track which scan we're showing
      setStats({ total:d.total||mapped.length, critical:counts.CRITICAL, high:counts.HIGH, medium:counts.MEDIUM, low:counts.LOW, risk_score:d.risk_score||0 });
      setLastScan(new Date().toLocaleTimeString());
      setReady(true); setBackendErr(false);
    } catch { setBackendErr(true); setReady(true); }
  }, []);

  useEffect(()=>{ load(); },[load]);

  // Refresh findings whenever the user navigates to cspm/dashboard/findings/compliance
  // This ensures stale state is never shown even if the scan completed in another tab
  const DATA_VIEWS = ["cspm","dashboard","findings","compliance","cwpp","reports"];
  useEffect(()=>{
    if (DATA_VIEWS.includes(view) && authToken) load();
  }, [view]); // eslint-disable-line

  const runScan = async () => {
    setScanning(true);
    setShowProgress(true);
    try {
      await apiFetch("/api/scan/run", { method:"POST", body:JSON.stringify({ image_name:"nginx:latest" }) });
      // Reload dashboard data with fresh findings from the new scan
      await load();
      // Bump scanKey — forces ScanHistoryPage to remount + refetch on next visit
      setScanKey(k => k + 1);
    } catch { setBackendErr(true); }
    setScanning(false);
    // Modal stays open until user clicks "View Results"
  };

  const closeProgress = () => {
    setShowProgress(false);
    // Switch to dashboard view so the user sees fresh results
    setView("dashboard");
  };

  const regenerateTip = async (f) => {
    setTips(p=>{ const n={...p}; delete n[f.id]; return n; });
    await getInlineTip(f, true);
  };

  const getInlineTip = async (f, force=false) => {
    if (!force && expanded===f.id) { setExpanded(null); return; }
    setExpanded(f.id);
    if (!force && tips[f.id]) return;
    setTipLoading(p=>({...p,[f.id]:true}));
    try {
      const prompt = [
        `You are a cloud security expert. Provide a step-by-step remediation guide for the following AWS security finding.`,
        ``,
        `Finding ID: ${f.id}`,
        `Severity: ${f.severity}`,
        `Title: ${f.finding}`,
        `Resource: ${f.resource}`,
        `Region: ${f.region || "global"}`,
        f.description ? `Description: ${f.description}` : "",
        f.remediation ? `Quick fix hint: ${f.remediation}` : "",
        ``,
        `Respond with:`,
        `1. WHY this is dangerous (1-2 sentences)`,
        `2. HOW TO FIX — exact numbered steps with AWS Console path OR CLI command for each step`,
        `3. HOW TO VERIFY — one command or check to confirm it's fixed`,
        ``,
        `Be specific to the exact resource name and severity. Keep it under 250 words.`,
      ].filter(Boolean).join("\n");

      const res = await apiFetch("/api/ai/chat", {
        method:"POST",
        body: JSON.stringify({ message: prompt }),
      });
      const d = await res.json();
      setTips(p=>({...p,[f.id]: d.reply||d.detail||"No fix suggestion available"}));
    } catch {
      setTips(p=>({...p,[f.id]:"Backend offline — start uvicorn and try again"}));
    }
    setTipLoading(p=>({...p,[f.id]:false}));
  };

  const showScanBtn = !["settings","ai"].includes(view);

  return (
    <div className="ss-layout">
      {showProgress && <ScanProgressModal onClose={closeProgress}/>}
      <Sidebar view={view} setView={setView} user={user} onSignOut={onSignOut}/>
      <div className="ss-content">
        <TopBar title={PAGE_TITLE[view]} lastScan={showScanBtn ? lastScan : null}
          lastScanId={showScanBtn ? lastScanId : null}
          onScan={showScanBtn ? runScan : null} scanning={scanning} onSignOut={onSignOut}
          awsConnected={awsConnected}/>

        {backendErr && (
          <div className="mx-4 mt-3 alert alert-danger py-2 px-3 flex-shrink-0 d-flex align-items-center gap-2" style={{borderRadius:8,fontSize:".83rem"}}>
            <i className="cil-warning flex-shrink-0"></i>
            Cannot reach API at localhost:8000. Start with:{" "}
            <code style={{background:"#f8d7da",padding:"1px 6px",borderRadius:4}}>uvicorn backend.main:app --reload --port 8000</code>
          </div>
        )}

        <main className="ss-main">
          {!ready ? (
            <div className="d-flex align-items-center justify-content-center gap-3" style={{height:200,color:"#9ca3af"}}>
              <Spinner dark/><span style={{fontSize:".88rem"}}>Loading scan data…</span>
            </div>
          ) : (
            <div>
              {view==="dashboard"  && <>
                {!awsConnected && (
                  <div className="mb-4 p-4 d-flex align-items-start gap-4" style={{background:"linear-gradient(135deg,#eff6ff 0%,#f0fdf4 100%)",border:"1px solid #bfdbfe",borderRadius:12}}>
                    <div className="d-flex align-items-center justify-content-center rounded-circle flex-shrink-0"
                      style={{width:52,height:52,background:"#fff",border:"2px solid #bfdbfe"}}>
                      <i className="cib-amazon-aws" style={{fontSize:"1.5rem",color:"#2563eb"}}></i>
                    </div>
                    <div className="flex-fill">
                      <div className="fw-bold mb-1" style={{color:"#1e40af",fontSize:".95rem"}}>Connect your AWS account to start scanning</div>
                      <p className="text-muted mb-2" style={{fontSize:".83rem"}}>
                        ShieldScan needs read-only AWS credentials to detect misconfigurations, check CIS Benchmark compliance, and score your security posture. Setup takes about 5 minutes.
                      </p>
                      <div className="d-flex flex-wrap gap-3 mb-3">
                        {["IAM Security Audit","S3 Public Access","CloudTrail Logging","VPC & Security Groups","RDS Encryption"].map(f=>(
                          <span key={f} className="d-flex align-items-center gap-1" style={{fontSize:".75rem",color:"#374151"}}>
                            <i className="cil-check" style={{color:"#16a34a",fontSize:".75rem"}}></i>{f}
                          </span>
                        ))}
                      </div>
                      <button onClick={()=>{ setSettingsTab("aws"); setView("settings"); }} className="btn btn-primary fw-semibold d-flex align-items-center gap-2"
                        style={{borderRadius:8,fontSize:".85rem",padding:"8px 20px"}}>
                        <i className="cib-amazon-aws"></i>Connect AWS Account
                      </button>
                    </div>
                  </div>
                )}
                <Dashboard findings={findings} stats={stats} onTip={getInlineTip} tips={tips} tipLoading={tipLoading} expanded={expanded}/>
              </>}
              {view==="findings"   && <FindingsTable findings={findings} onTip={getInlineTip} tips={tips} tipLoading={tipLoading} expanded={expanded}/>}
              {view==="scans"      && <ScanHistoryPage key={scanKey}/>}
              {view==="cspm"       && <CSPMPage findings={findings} lastScanId={lastScanId} onRefresh={load} onTip={getInlineTip} onRegenerate={regenerateTip} tips={tips} tipLoading={tipLoading} expanded={expanded}/>}
              {view==="cwpp"       && <CWPPPage findings={findings}/>}
              {view==="compliance" && <CompliancePage findings={findings}/>}
              {view==="inventory"  && <InventoryPage/>}
              {view==="reports"    && <ReportsPage findings={findings} stats={stats}/>}
              {view==="ai"         && <div style={{height:"calc(100vh - 140px)"}}><AIAssistant/></div>}
              {view==="settings"   && <SettingsPage user={user} goToView={setView} initialTab={settingsTab} onAwsConnect={()=>setAwsConnected(true)} onAwsDisconnect={()=>setAwsConnected(false)} onSignOut={handleSignOut}/>}
              {view==="security"   && <SecurityPage onSignOut={handleSignOut}/>}
              {view==="cnappgoat"  && <CNAPPgoatLab/>}
            </div>
          )}
        </main>
      </div>
      <FloatWidget/>
    </div>
  );
}

/* ── Root ─────────────────────────────────────────────────────────────────── */

function App() {
  const [authPage, setAuthPage] = useState("login");

  // Init user from localStorage so a page reload lands on the dashboard, not login
  const [user, setUser] = useState(() => {
    try {
      const raw = localStorage.getItem("ss_session");
      return raw ? JSON.parse(raw).user : null;
    } catch { return null; }
  });

  const [initialView, setInitialView] = useState("dashboard");
  const [initialSettingsTab, setInitialSettingsTab] = useState("profile");
  const [verifying, setVerifying] = useState(!!authToken); // true only when restoring a session

  // Detect password-reset deep-link: http://localhost:3000/#reset?token=XXXX
  const [resetTokenFromUrl, setResetTokenFromUrl] = useState(() => {
    const hash = window.location.hash;
    if (hash.startsWith("#reset")) {
      const params = new URLSearchParams(hash.replace(/^#reset\?/, ""));
      const t = params.get("token");
      if (t) {
        window.history.replaceState(null, "", window.location.pathname);
        return t;
      }
    }
    return "";
  });

  // Detect account-recovery deep-link: http://localhost:3000/#recover?token=XXXX
  const [recoverTokenFromUrl, setRecoverTokenFromUrl] = useState(() => {
    const hash = window.location.hash;
    if (hash.startsWith("#recover")) {
      const params = new URLSearchParams(hash.replace(/^#recover\?/, ""));
      const t = params.get("token");
      if (t) {
        window.history.replaceState(null, "", window.location.pathname);
        return t;
      }
    }
    return "";
  });

  const handleSignOut = () => {
    authToken = null;
    _clearSession();
    setUser(null);
    setAuthPage("login");
    setInitialView("dashboard");
    setInitialSettingsTab("profile");
    setResetTokenFromUrl("");
    setVerifying(false);
  };

  // On mount: if we restored a token, verify it with the API.
  // If expired or invalid → auto sign-out so user sees login, not a broken state.
  useEffect(() => {
    if (!authToken) { setVerifying(false); return; }
    apiFetch("/api/auth/me")
      .then(r => {
        if (!r.ok) { handleSignOut(); return null; }
        return r.json();
      })
      .then(u => { if (u) { setUser(u); _persistSession(u); } })
      .catch(() => handleSignOut())
      .finally(() => setVerifying(false));
  }, []); // eslint-disable-line

  const handleLogin = (userData) => {
    _persistSession(userData);
    setUser(userData);
  };

  // Called from SignupPage "Set up" buttons — lands user in Settings → Security
  const handleSignupWithTab = (u, secTab) => {
    _persistSession(u);
    if (secTab) {
      setInitialView("settings");
      setInitialSettingsTab(secTab);
    } else {
      setInitialView("dashboard");
      setInitialSettingsTab("profile");
    }
    setUser(u);
  };

  // Show a brief loading state while verifying a restored session
  if (verifying) {
    return React.createElement("div", {
      style:{ display:"flex", alignItems:"center", justifyContent:"center",
              height:"100vh", flexDirection:"column", gap:16, color:"#64748b" }
    },
      React.createElement("div", { style:{ width:36, height:36, border:"3px solid #e2e8f0",
        borderTopColor:"var(--ss,#16a34a)", borderRadius:"50%", animation:"spin 0.8s linear infinite" }}),
      React.createElement("span", { style:{fontSize:".85rem"} }, "Restoring your session…")
    );
  }

  if (!user) {
    if (authPage === "login")
      return React.createElement(LoginPage, {
        onLogin: handleLogin,
        onGoSignup: () => setAuthPage("signup"),
        initialResetToken: resetTokenFromUrl,
        initialRecoverToken: recoverTokenFromUrl,
      });
    return React.createElement(SignupPage, { onSignup:handleSignupWithTab, onGoLogin:()=>setAuthPage("login") });
  }
  return React.createElement(MainApp, { user, onSignOut: handleSignOut, initialView, initialSettingsTab });
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
